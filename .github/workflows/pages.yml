name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize PNG icons
        run: python3 scripts/write_icons.py
      - uses: actions/configure-pages@v5
      - name: Stage static site
        run: |
          mkdir -p _site/data _site/icons _site/audio
          cp index.html manifest.webmanifest sw.js .nojekyll _site/
          cp data/lessons.json _site/data/
          cp icons/* _site/icons/
          if [ -d audio ]; then cp -r audio/. _site/audio/; fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
