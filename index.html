              onClick: () => toggleStudied(lesson.date)
            })
          ])
        ]);

        const header = el("section", { class: "detail-header" }, [
          el("div", { class: "detail-meta" }, [
            el("span", { class: "cat-badge", text: `${catMeta.icon} ${lesson.category}` }),
            el("span", { text: lesson.dateLabel })
          ]),
          el("h1", { class: "detail-title", text: lesson.title }),
          el("p", { class: "detail-intro", text: lesson.intro })
        ]);

        const toolbar = el("div", { class: "detail-toolbar" }, [
          el("div", { class: "toolbar-left" }, [
            hasSpeech
              ? el("button", {
                  id: "play-all-btn",
                  type: "button",
                  class: "btn btn-primary",
                  text: state.speaking ? "■ 중지" : "▶ 전체 듣기",
                  "aria-label": state.speaking ? "전체 듣기 중지" : "전체 듣기",
                  onClick: () => {
                    if (aiOnFor(lesson)) {
                      if (state.speaking) {
                        stopSpeech();
                        updateSpeakingUI();
                      } else {
                        playAiLines(lesson, 0, lesson.dialogue.length);
                      }
                      return;
                    }
                    speakDialogue(
                      lesson.dialogue.map((l) => l.text),
                      dualOnFor(lesson) ? lesson.dialogue.map((l) => roleVoiceFor(lesson, l.speaker)) : null,
                      dualOnFor(lesson) ? lesson.dialogue.map((l) => isYou(l.speaker)) : null
                    );
                  }
                })
              : null,
            hasSpeech
              ? el("button", {
                  type: "button",
                  class: "btn",
                  text: `속도 ${RATES[state.rateIdx]}x`,
                  onClick: () => {
                    state.rateIdx = (state.rateIdx + 1) % RATES.length;
                    saveState();
                    render();
                  }
                  })
                  : null,
                  hasSpeech && (DUAL_VOICE_DATES.has(lesson.date) || AI_VOICE_DATES.has(lesson.date))
                  ? el("button", {
                  type: "button",
                  class: "btn btn-dual" + (state.dualVoice ? " is-on" : ""),
                  text: state.dualVoice ? "2인 음성" : "1인 음성",
                  "aria-label": "대화 음성 모드",
                  "aria-pressed": state.dualVoice ? "true" : "false",
                  title: state.dualVoice
                  ? "여행자=남자 · 직원=여자 다른 목소리 (켜짐)"
                  : "한 목소리로 듣기",
                  onClick: () => {
                  stopSpeech();
                  state.dualVoice = !state.dualVoice;
                  saveDualVoice();
                  if (state.dualVoice && window.__warmupVoices) window.__warmupVoices();
                  render();
                  }
                  })
                  : null
                  ]),
          el("div", { class: "toolbar-right toolbar-lang-row" }, [
            el("button", {
              type: "button",
              class: "toggle-btn icon-only",
              text: "⛶",
              "aria-label": "전체화면",
              title: "전체화면",
              onClick: () => openFullscreen(0)
            }),
            ...langToggleButtons()
          ])
        ]);

        const chatSection = el("section", { class: "section-card" }, [
          el("h2", { class: "section-heading", text: "대화" }),
          el("div", { class: "chat-list" },
            lesson.dialogue.map((line, i) => {
              const m = lesson.meaning[i];
              const you = isYou(line.speaker);
              const speakerText = m ? `${line.speaker} · ${m.speaker}` : line.speaker;

              return el("div", { class: "bubble-row " + (you ? "is-you" : "is-staff") }, [
                el("div", {
                  class: "bubble" + (state.speaking && state.speakingLineIdx === i ? " is-speaking" : ""),
                  "data-line-idx": String(i)
                }, [
                  el("div", { class: "bubble-head" }, [
                    el("span", { class: "bubble-speaker", text: speakerText }),
                    el("div", { class: "bubble-actions" }, [
                      hasSpeech
                        ? el("button", {
                            type: "button",
                            class: "mini-btn",
                            text: "▶ 듣기",
                            onClick: () => {
                              if (aiOnFor(lesson)) {
                                playAiLines(lesson, i, i + 1);
                                return;
                              }
                              speakSingle(line.text, roleVoiceFor(lesson, line.speaker), isYou(line.speaker));
                            }
                          })
                        : null,
                      googleStudyLink(line.text),
                      micButton("line-" + i)
                    ])
                  ]),
                  langText("p", "bubble-en", line.text, "en", "line-" + i),
                  m ? langText("p", "bubble-ko", m.text, "ko", "line-" + i) : null,
                  micHost("line-" + i)
                ])
              ]);
            })
          )
        ]);

        const exprSection = el("section", { class: "section-card" }, [
          el("h2", { class: "section-heading", text: "핵심 표현" }),
          el("div", { class: "expr-grid" },
            lesson.expressions.map((item, i) =>
              el("div", { class: "expr-block" }, [
                el("div", { class: "expr-card" }, [
                  el("div", {}, [
                    langText("p", "expr-en", item.en, "en", "expr-" + i),
                    langText("p", "expr-ko", item.ko, "ko", "expr-" + i)
                  ]),
                  el("div", { class: "expr-actions" }, [
                    hasSpeech
                      ? el("button", {
                          type: "button",
                          class: "mini-btn",
                          "aria-label": `${item.en} 듣기`,
                          text: "▶",
                          onClick: () => speakSingle(item.en)
                        })
                      : null,
                    googleStudyLink(item.en),
                    micButton("expr-" + i)
                  ])
                ]),
                micHost("expr-" + i)
              ])
            )
          )
        ]);

        const practiceSection = el("section", { class: "section-card" }, [
          el("h2", { class: "section-heading", text: "따라 말해 보기" }),
          el("div", { class: "practice-box" }, [
            langText("p", "practice-en", lesson.practice, "en", "practice"),
            el("div", { class: "practice-actions" }, [
              hasSpeech
                ? el("button", {
                    type: "button",
                    class: "btn btn-primary",
                    text: "▶ 이 문장 듣기",
                    onClick: () => speakSingle(lesson.practice)
                  })
                : null,
              googleStudyLink(lesson.practice),
              micButton("practice")
            ])
          ]),
          micHost("practice"),
          lesson.practiceNote
            ? el("p", { class: "practice-note", text: lesson.practiceNote })
            : null
        ]);

        const bottomNav = el("nav", { class: "bottom-bar", "aria-label": "대화 이동" }, [
          el("div", { class: "bottom-inner" }, [
            el("button", {
              type: "button",
              class: "btn",
              disabled: !prevLesson,
              text: "← 이전",
              onClick: () => prevLesson && openLesson(prevLesson.date)
            }),
            el("button", {
              type: "button",
              class: "btn",
              text: "목록",
              onClick: () => openLesson(null)
            }),
            el("button", {
              type: "button",
              class: "btn btn-primary",
              disabled: !nextLesson,
              text: "다음 →",
              onClick: () => nextLesson && openLesson(nextLesson.date)
            })
          ])
        ]);

        appEl.replaceChildren(topbar, header, toolbar, chatSection, exprSection, practiceSection, bottomNav);
      }

      function render() {
        if (state.loading) {
          appEl.replaceChildren(
            el("div", { class: "empty-state", text: "대화 목록을 불러오는 중..." })
          );
          return;
        }
        if (state.error) {
          appEl.replaceChildren(
            el("div", { class: "empty-state" }, [
              el("p", { text: "대화를 불러오지 못했어요: " + state.error }),
              el("button", { type: "button", class: "btn", text: "다시 시도", onClick: initData })
            ])
          );
          return;
        }
        if (state.openDate) {
          const found = state.lessons.find((d) => d.date === state.openDate);
          if (found) {
            renderDetail(found);
            if (state.fsOpen) showStudyUi();
            return;
          }
        }
        if (state.speaking) stopSpeech();
        stopMic({ silent: true, discard: true });
        if (state.fsOpen) closeFullscreen({ silent: true, keepHash: true });
        renderHome();
      }

      function desiredLocation(allowSession) {
        const loc = parseLocation();
        if (loc.date && loc.study != null) return loc;
        if (allowSession) {
          const sess = readStudySession();
          if (sess && sess.date && (!loc.date || sess.date === loc.date)) {
            return { date: loc.date || sess.date, study: sess.index };
          }
        }
        return loc;
      }

      function syncFromLocation(opts) {
        if (locQuiet || state.loading) return;
        const allowSession = Boolean(opts && opts.allowSession);
        const loc = desiredLocation(allowSession);
        if (loc.date !== state.openDate) {
          stopMic({ silent: true, discard: true });
          clearMicResults();
          stopSpeech();
          if (state.fsOpen && loc.study == null) hideStudyUi();
          state.openDate = loc.date;
          state.openKo = {};
          state.openEn = {};
          if (loc.study == null) state.fsPushed = false;
        }
        if (loc.date && loc.study != null) {
          const lesson = state.lessons.find((d) => d.date === loc.date);
          if (lesson) {
            const last = Math.max(0, getFsCards(lesson).length - 1);
            const wasOpen = Boolean(state.fsOpen && fs.root && fs.root.classList.contains("is-open"));
            state.fsOpen = true;
            state.fsIndex = Math.max(0, Math.min(loc.study, last));
            if (!wasOpen) state.fsNeedAutoStart = true;
            const sess = readStudySession();
            if (sess && sess.date === loc.date) {
              if (sess.showAllKo != null && typeof state.showAllKo === "boolean" && allowSession) {
                /* 가/A already come from localStorage; session is a backup if hash restore happens mid-session */
              }
            }
            writeStudySession();
            const url = lessonHash(state.openDate, state.fsIndex);
            if (location.hash !== url) setLocation(url, "replace");
          }
        } else if (state.fsOpen) {
          closeFullscreen({ silent: true, fromPop: true });
        }
        render();
      }

      function restoreStudyIfNeeded() {
        if (locQuiet || state.loading || !state.lessons.length) return;
        const loc = desiredLocation(true);
        if (!loc.date || loc.study == null) return;
        if (state.openDate !== loc.date) {
          syncFromLocation({ allowSession: true });
          return;
        }
        if (!state.fsOpen || !fs.root || !fs.root.classList.contains("is-open")) {
          state.fsOpen = true;
          state.fsIndex = loc.study;
          state.fsNeedAutoStart = true;
          writeStudySession();
          const url = lessonHash(loc.date, state.fsIndex);
          if (location.hash !== url) setLocation(url, "replace");
          render();
        }
      }

      async function initData() {
        state.loading = true;
        state.error = null;
        render();
        try {
          const res = await fetch("./data/lessons.json");
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          state.lessons = await res.json();
          state.loading = false;
          syncFromLocation({ allowSession: true });
        } catch (err) {
          state.loading = false;
          state.error = err && err.message ? err.message : String(err);
          render();
        }
      }

      window.addEventListener("hashchange", () => syncFromLocation());
      window.addEventListener("popstate", () => syncFromLocation());
      window.addEventListener("pageshow", () => restoreStudyIfNeeded());
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") restoreStudyIfNeeded();
        else stopMic({ silent: true });
      });
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        state.installPrompt = e;
        if (!state.openDate) render();
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").then((reg) => {
            if (reg.active || navigator.serviceWorker.controller) {
              state.offlineReady = true;
              if (!state.openDate) render();
            }
            reg.addEventListener("updatefound", () => {
              const nw = reg.installing;
              if (!nw) return;
              nw.addEventListener("statechange", () => {
                if (nw.state === "activated") {
                  state.offlineReady = true;
                  if (!state.openDate) render();
                }
              });
            });
            // A page already controlled by a service worker was served the cached
            // build; when a newly deployed SW takes over, reload once so users get
            // the fix without manual refresh (stale-SW report, 2026-11).
            if (navigator.serviceWorker.controller) {
              const prevCtrl = navigator.serviceWorker.controller;
              navigator.serviceWorker.addEventListener("controllerchange", () => {
                if (navigator.serviceWorker.controller !== prevCtrl) location.reload();
              });
            }
            reg.update().catch(() => {});
          }).catch(() => {});
        });
      }

      initFullscreen();
      initData();
    })();
  </script>
</body>
</html>
