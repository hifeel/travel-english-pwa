<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>여행 영어 대화 모음</title>
  <meta name="description" content="매일 아침 여행 영어 대화 100개 모음 — 검색, 분류, 영어 듣기, 오프라인 학습 지원" />
  <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121518" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="여행 영어" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <style>
    :root {
      --bg: #f7f4ee;
      --surface: #ffffff;
      --surface-subtle: #f0ece3;
      --surface-you: #e7f2f6;
      --surface-practice: #fdf6e9;
      --border: #e3ddd1;
      --border-strong: #cfc7b8;
      --text: #1b1f24;
      --text-secondary: #535a63;
      --text-tertiary: #7b828c;
      --accent: #1a5f76;
      --accent-hover: #144d60;
      --accent-soft: #e2f0f5;
      --accent-text: #ffffff;
      --gold: #b45309;
      --gold-soft: #fef3dc;
      --green: #157347;
      --green-soft: #e7f6ed;
      --shadow-sm: 0 1px 2px rgba(27, 31, 36, 0.04);
      --shadow-md: 0 6px 20px rgba(27, 31, 36, 0.07);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --max-w: 840px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121518;
        --surface: #1b2026;
        --surface-subtle: #232a32;
        --surface-you: #17303b;
        --surface-practice: #2a2417;
        --border: #2c333c;
        --border-strong: #3d4754;
        --text: #eef1f4;
        --text-secondary: #adb5bf;
        --text-tertiary: #7d8794;
        --accent: #67b7cf;
        --accent-hover: #83c7dc;
        --accent-soft: #1a333e;
        --accent-text: #0e1418;
        --gold: #f5b95b;
        --gold-soft: #312613;
        --green: #5fd18d;
        --green-soft: #142f20;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", "Pretendard", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    button, input {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));
    }

    /* Header */
    .hero {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .hero-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .hero h1 {
      margin: 0;
      font-size: 1.65rem;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .hero-sub {
      margin: 0;
      color: var(--text-secondary);
      font-size: 0.94rem;
    }

    .stats-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      box-shadow: var(--shadow-sm);
    }

    .stat-pill.is-offline {
      color: var(--green);
      background: var(--green-soft);
      border-color: transparent;
    }

    .install-btn {
      padding: 6px 13px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 0.84rem;
      font-weight: 650;
    }

    /* Search & filters */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 13px;
      color: var(--text-tertiary);
      pointer-events: none;
      font-size: 0.95rem;
    }

    .search-input {
      width: 100%;
      padding: 11px 38px 11px 38px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-clear {
      position: absolute;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: none;
      background: var(--surface-subtle);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    .chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-secondary);
      font-size: 0.84rem;
      font-weight: 550;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .chip:hover {
      border-color: var(--border-strong);
    }

    .chip.is-active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
      font-weight: 650;
    }

    .chip-count {
      font-size: 0.78rem;
      opacity: 0.78;
      font-variant-numeric: tabular-nums;
    }

    .subfilters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 4px;
      border-top: 1px solid var(--border);
    }

    .status-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .status-chip {
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: var(--surface-subtle);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 550;
    }

    .status-chip.is-active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 650;
    }

    .result-meta {
      font-size: 0.82rem;
      color: var(--text-tertiary);
    }

    /* Scene card grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .scene-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
      cursor: pointer;
    }

    .scene-card:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-strong);
    }

    .scene-card.is-studied {
      border-left: 3.5px solid var(--green);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-tertiary);
    }

    .cat-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-subtle);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.77rem;
    }

    .card-marks {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .icon-mark {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-tertiary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.92rem;
    }

    .icon-mark:hover {
      background: var(--surface-subtle);
    }

    .icon-mark.is-fav {
      color: var(--gold);
      background: var(--gold-soft);
    }

    .icon-mark.is-done {
      color: var(--green);
      background: var(--green-soft);
    }

    .card-title {
      margin: 0;
      font-size: 1.06rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .card-sub {
      margin: 0;
      font-size: 0.88rem;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty-state {
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 36px 20px;
      text-align: center;
      color: var(--text-secondary);
    }

    .footer-note {
      margin-top: 22px;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: var(--surface-subtle);
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Single-dialogue detail view */
    .detail-topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
      transition: background 0.14s ease, border-color 0.14s ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-subtle);
    }

    .btn:disabled {
      opacity: 0.42;
      cursor: default;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-done.is-on {
      background: var(--green-soft);
      border-color: var(--green);
      color: var(--green);
    }

    .btn-fav.is-on {
      background: var(--gold-soft);
      border-color: var(--gold);
      color: var(--gold);
    }

    .detail-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.84rem;
      color: var(--text-tertiary);
    }

    .detail-title {
      margin: 0 0 6px;
      font-size: 1.4rem;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .detail-intro {
      margin: 0;
      color: var(--text-secondary);
      font-size: 0.94rem;
    }

    .detail-toolbar {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 30;
      margin: 0 -16px 14px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .toggle-btn.is-on {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .toggle-btn.lang-toggle {
      min-width: 42px;
      justify-content: center;
      padding: 6px 10px;
      font-size: 1.08rem;
      font-weight: 800;
    }

    .is-blurred {
      filter: blur(5px);
      opacity: 0.6;
      user-select: none;
      -webkit-user-select: none;
    }

    [data-lang] {
      cursor: pointer;
    }

    .section-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    .section-heading {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Chat bubbles */
    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .bubble-row {
      display: flex;
      flex-direction: column;
      max-width: 90%;
    }

    .bubble-row.is-you {
      align-self: flex-end;
      align-items: flex-end;
    }

    .bubble-row.is-staff {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      width: 100%;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .bubble-row.is-you .bubble {
      background: var(--surface-you);
      border-bottom-right-radius: 5px;
    }

    .bubble-row.is-staff .bubble {
      border-bottom-left-radius: 5px;
    }

    .bubble.is-speaking {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .bubble-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .bubble-speaker {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-tertiary);
    }

    .bubble-actions {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .mini-btn {
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .mini-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    a.mini-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-decoration: none;
      line-height: 1.3;
      white-space: nowrap;
    }

    .expr-actions,
    .practice-actions {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      gap: 6px;
    }

    .bubble-en {
      margin: 0;
      font-size: 1rem;
      font-weight: 550;
      color: var(--text);
    }

    .bubble-ko {
      margin: 6px 0 0;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
      font-size: 0.89rem;
      color: var(--text-secondary);
    }

    /* Key expressions */
    .expr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 10px;
    }

    .expr-card {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .expr-en {
      margin: 0;
      font-size: 0.94rem;
      font-weight: 650;
      color: var(--text);
    }

    .expr-ko {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* Practice highlight */
    .practice-box {
      padding: 15px 16px;
      border-radius: var(--radius-md);
      background: var(--surface-practice);
      border: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .practice-en {
      margin: 0;
      font-size: 1.06rem;
      font-weight: 700;
      color: var(--text);
    }

    .practice-note {
      margin: 10px 0 0;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* Bottom nav bar */
    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      z-index: 20;
    }

    .bottom-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .bottom-inner .btn {
      flex: 1;
      max-width: 180px;
    }

    @media (max-width: 560px) {
      .hero h1 { font-size: 1.42rem; }
      .bubble-row { max-width: 96%; }
      .card-grid { grid-template-columns: 1fr; }
    }

    .detail-toolbar .toolbar-right {
      flex-wrap: nowrap;
      flex-shrink: 0;
    }

    .toolbar-lang-row {
      display: inline-flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    body.fs-open {
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* Study view hides the lesson 목록 top bar and 이전/목록/다음 bottom nav */
    body.fs-open .detail-topbar,
    body.fs-open .detail-toolbar,
    body.fs-open .bottom-bar {
      display: none;
    }

    .toggle-btn.icon-only {
      min-width: 42px;
      justify-content: center;
      padding: 6px 10px;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .fs-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .fs-overlay.is-open {
      display: flex;
    }

    .fs-top {
      flex-shrink: 0;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 12px;
    }

    .fs-bottom {
      flex-shrink: 0;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 16px 14px;
      background: color-mix(in srgb, var(--bg) 94%, transparent);
    }

    .fs-top-actions {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .fs-icon-btn {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1.15rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .fs-icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .fs-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      touch-action: none;
    }

    .fs-card {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 6px 16px;
      text-align: center;
      transition: transform 0.3s ease;
      will-change: transform;
    }

    .fs-card.is-from-right { transform: translateX(110%); }
    .fs-card.is-from-left { transform: translateX(-110%); }
    .fs-card.is-in { transform: translateX(0); }
    .fs-card.is-to-left { transform: translateX(-110%); }
    .fs-card.is-to-right { transform: translateX(110%); }

    .fs-speaker {
      margin: 0 0 14px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-tertiary);
    }

    .fs-en {
      margin: 0;
      font-size: clamp(1.85rem, 7vw, 2.87rem);
      font-weight: 750;
      line-height: 1.35;
      max-width: min(22em, 100%);
      width: fit-content;
      padding: 0.12em 0.2em;
      overflow-wrap: break-word;
      text-align: center;
    }

    .fs-ko {
      margin: 14px 0 0;
      font-size: clamp(0.94rem, 3.1vw, 1.15rem);
      color: var(--text-secondary);
      line-height: 1.5;
      max-width: min(24em, 100%);
      width: fit-content;
      padding: 0.12em 0.2em;
      text-align: center;
    }

    .fs-progress {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 3.25em;
    }

    .fs-actions {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .fs-dock-btn {
      width: 58px;
      height: 58px;
      min-width: 58px;
      min-height: 58px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      line-height: 0;
    }

    .fs-dock-btn svg {
      width: 26px;
      height: 26px;
      display: block;
    }

    .fs-dock-play {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .fs-dock-btn:hover {
      border-color: var(--accent);
    }

    .fs-dock-play:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: var(--accent-text);
    }

    @media (max-width: 560px) {
      .toggle-btn.lang-toggle,
      .toggle-btn.icon-only {
        min-width: 36px;
        height: 36px;
        padding: 4px 8px;
        font-size: 1rem;
      }

      .fs-icon-btn {
        width: 36px;
        height: 36px;
      }

      .fs-top .toggle-btn {
        padding: 4px 8px;
        font-size: 0.8rem;
      }

      .detail-toolbar {
        gap: 6px;
      }

      .detail-toolbar .btn {
        padding: 6px 9px;
        font-size: 0.8rem;
        white-space: nowrap;
      }

      .toolbar-left,
      .toolbar-right,
      .toolbar-lang-row {
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <main id="app" class="app" aria-live="polite"></main>

  <script>
    (() => {
      const STORAGE_KEY = "travel-english-pwa-v1";
      const CATEGORIES = ["전체", "공항", "호텔", "식당", "교통", "쇼핑", "긴급/병원", "기타"];
      const CATEGORY_META = {
        "공항": { icon: "✈️" },
        "호텔": { icon: "🏨" },
        "식당": { icon: "🍽️" },
        "교통": { icon: "🚲" },
        "쇼핑": { icon: "🛍️" },
        "긴급/병원": { icon: "🩺" },
        "기타": { icon: "💬" }
      };

      const STATUS_FILTERS = [
        { id: "all", label: "전체" },
        { id: "unstudied", label: "미학습" },
        { id: "studied", label: "학습 완료" },
        { id: "favorite", label: "즐겨찾기" }
      ];

      const RATES = [0.8, 0.9, 1.0];

      const loadSaved = () => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { studied: {}, favorite: {}, showAllKo: true, showAllEn: true, rateIdx: 1 };
          const parsed = JSON.parse(raw);
          return {
            studied: parsed.studied && typeof parsed.studied === "object" ? parsed.studied : {},
            favorite: parsed.favorite && typeof parsed.favorite === "object" ? parsed.favorite : {},
            showAllKo: typeof parsed.showAllKo === "boolean" ? parsed.showAllKo : true,
            showAllEn: typeof parsed.showAllEn === "boolean" ? parsed.showAllEn : true,
            rateIdx: typeof parsed.rateIdx === "number" && RATES[parsed.rateIdx] ? parsed.rateIdx : 1
          };
        } catch {
          return { studied: {}, favorite: {}, showAllKo: true, showAllEn: true, rateIdx: 1 };
        }
      };

      const saved = loadSaved();
      const saveState = () => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            studied: state.studied,
            favorite: state.favorite,
            showAllKo: state.showAllKo,
            showAllEn: state.showAllEn,
            rateIdx: state.rateIdx
          }));
        } catch {}
      };

      const state = {
        lessons: [],
        loading: true,
        error: null,
        query: "",
        category: "전체",
        statusFilter: "all",
        openDate: null,
        studied: saved.studied,
        favorite: saved.favorite,
        showAllKo: saved.showAllKo,
        showAllEn: saved.showAllEn,
        openKo: {},
        openEn: {},
        rateIdx: saved.rateIdx,
        speaking: false,
        speakingLineIdx: -1,
        offlineReady: false,
        installPrompt: null,
        fsOpen: false,
        fsIndex: 0,
        fsAutoplay: false,
        fsAnimating: false,
        fsPushed: false
      };

      const appEl = document.getElementById("app");
      const hasSpeech = typeof window !== "undefined" && "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;

      function el(tag, attrs = {}, children = []) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (v === undefined || v === null || v === false) continue;
          if (k === "class") node.className = v;
          else if (k === "text") node.textContent = v;
          else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
          else if (k === "disabled") node.disabled = Boolean(v);
          else node.setAttribute(k, String(v));
        }
        const list = Array.isArray(children) ? children : [children];
        for (const ch of list) {
          if (ch === null || ch === undefined || ch === false) continue;
          node.appendChild(typeof ch === "string" ? document.createTextNode(ch) : ch);
        }
        return node;
      }

      function formatDotDate(iso) {
        return iso.replace(/-/g, ".");
      }

      function isYou(speaker) {
        return speaker === "You" || speaker === "나";
      }

      function googleStudyUrl(sentence) {
        return "https://www.google.com/search?q=" + encodeURIComponent(String(sentence) + " 이 문장으로 영어공부시켜줘");
      }

      function googleStudyLink(sentence) {
        return el("a", {
          class: "mini-btn google-search-btn",
          href: googleStudyUrl(sentence),
          target: "_blank",
          rel: "noopener",
          "aria-label": `${sentence} 구글 검색`,
          text: "G 검색"
        });
      }

      function svgIcon(pathD) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("aria-hidden", "true");
        svg.setAttribute("focusable", "false");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", pathD);
        path.setAttribute("fill", "currentColor");
        svg.appendChild(path);
        return svg;
      }

      function speakerIcon() {
        return svgIcon("M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z");
      }

      function stopIcon() {
        return svgIcon("M6 6h12v12H6z");
      }

      function googleGIcon() {
        return svgIcon("M12 11v2.4h4.19c-.18 1.17-1.4 3.43-4.19 3.43-2.52 0-4.58-2.09-4.58-4.83S9.48 7.17 12 7.17c1.44 0 2.4.61 2.95 1.14l2.01-1.93C15.47 5.14 13.89 4.4 12 4.4 7.96 4.4 4.7 7.7 4.7 12s3.26 7.6 7.3 7.6c4.21 0 7-2.96 7-7.12 0-.48-.05-.84-.11-1.2H12z");
      }

      function setFsPlayIcon() {
        if (!fs.playBtn) return;
        const speaking = Boolean(state.speaking);
        fs.playBtn.replaceChildren(speaking ? stopIcon() : speakerIcon());
        fs.playBtn.setAttribute("aria-label", speaking ? "정지" : "듣기");
        fs.playBtn.setAttribute("title", speaking ? "정지" : "듣기");
      }

      function fsGoogleLink(sentence) {
        return el("a", {
          class: "fs-dock-btn",
          href: googleStudyUrl(sentence),
          target: "_blank",
          rel: "noopener",
          "aria-label": "구글 검색",
          title: "구글 검색"
        }, [googleGIcon()]);
      }

      function isLangVisible(kind, key) {
        const allOn = kind === "en" ? state.showAllEn : state.showAllKo;
        const opened = kind === "en" ? state.openEn : state.openKo;
        return allOn !== Boolean(key && opened[key]);
      }

      function toggleLangLine(kind, key) {
        if (!kind || !key) return;
        const opened = kind === "en" ? state.openEn : state.openKo;
        if (opened[key]) delete opened[key];
        else opened[key] = true;
        syncLangVisibility();
      }

      function langText(tag, className, text, kind, key, opts) {
        const visible = isLangVisible(kind, key, opts);
        const attrs = {
          class: className + (visible ? "" : " is-blurred"),
          text,
          "data-lang": kind,
          "data-lang-key": key
        };
        if (!(opts && opts.noToggle)) {
          const opened = kind === "en" ? state.openEn : state.openKo;
          attrs.onClick = (e) => {
            e.stopPropagation();
            if (opened[key]) delete opened[key];
            else opened[key] = true;
            syncLangVisibility();
          };
          attrs.title = visible ? "탭해서 이 문장 가리기" : "탭해서 이 문장만 보기";
          if (!visible) attrs["aria-hidden"] = "true";
        }
        return el(tag, attrs);
      }

      function syncLangVisibility() {
        document.querySelectorAll("[data-lang]").forEach((el) => {
          const kind = el.getAttribute("data-lang");
          const key = el.getAttribute("data-lang-key");
          const visible = isLangVisible(kind, key);
          el.classList.toggle("is-blurred", !visible);
          el.title = visible ? "탭해서 이 문장 가리기" : "탭해서 이 문장만 보기";
          if (!visible) el.setAttribute("aria-hidden", "true");
          else el.removeAttribute("aria-hidden");
        });
        document.querySelectorAll(".toggle-btn.lang-toggle").forEach((btn) => {
          const isKo = btn.getAttribute("aria-label") === "한국어 뜻 보이기";
          const on = isKo ? state.showAllKo : state.showAllEn;
          btn.classList.toggle("is-on", on);
          btn.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }

      function langToggleButtons() {
        return [
          el("button", {
            type: "button",
            class: "toggle-btn lang-toggle" + (state.showAllKo ? " is-on" : ""),
            text: "가",
            "aria-label": "한국어 뜻 보이기",
            "aria-pressed": state.showAllKo ? "true" : "false",
            onClick: () => {
              state.showAllKo = !state.showAllKo;
              state.openKo = {};
              saveState();
              syncLangVisibility();
            }
          }),
          el("button", {
            type: "button",
            class: "toggle-btn lang-toggle" + (state.showAllEn ? " is-on" : ""),
            text: "A",
            "aria-label": "영어 보이기",
            "aria-pressed": state.showAllEn ? "true" : "false",
            onClick: () => {
              state.showAllEn = !state.showAllEn;
              state.openEn = {};
              saveState();
              syncLangVisibility();
            }
          })
        ];
      }

      function currentOpenLesson() {
        return state.lessons.find((d) => d.date === state.openDate) || null;
      }

      function getNextLessonByDate(lesson) {
        if (!lesson) return null;
        const i = state.lessons.findIndex((d) => d.date === lesson.date);
        return i >= 0 ? state.lessons[i + 1] || null : null;
      }

      function getPrevLessonByDate(lesson) {
        if (!lesson) return null;
        const i = state.lessons.findIndex((d) => d.date === lesson.date);
        return i > 0 ? state.lessons[i - 1] : null;
      }

      function getFsCards(lesson) {
        if (!lesson) return [];
        const cards = [];
        lesson.dialogue.forEach((line, i) => {
          const m = lesson.meaning[i];
          cards.push({
            section: "대화",
            speakerEn: line.speaker,
            speakerKo: m ? m.speaker : (isYou(line.speaker) ? "나" : "직원"),
            en: line.text,
            ko: m ? m.text : "",
            key: "line-" + i
          });
        });
        (lesson.expressions || []).forEach((item, i) => {
          cards.push({
            section: "핵심 표현",
            speakerEn: "",
            speakerKo: "",
            en: item.en,
            ko: item.ko,
            key: "expr-" + i
          });
        });
        if (lesson.practice) {
          cards.push({
            section: "따라 말해 보기",
            speakerEn: "",
            speakerKo: "",
            en: lesson.practice,
            ko: "",
            key: "practice"
          });
        }
        return cards;
      }

      function speakerLabel(card) {
        if (card.speakerEn && card.speakerKo) return card.speakerEn + " · " + card.speakerKo;
        return card.speakerEn || card.speakerKo || "";
      }

      function buildFsCard(card) {
        const label = speakerLabel(card);
        return el("div", {
          class: "fs-card",
          title: "탭해서 듣기",
          "aria-label": "탭해서 듣기"
        }, [
          label ? el("p", { class: "fs-speaker", text: label }) : null,
          langText("p", "fs-en", card.en, "en", card.key, { noToggle: true }),
          card.ko ? langText("p", "fs-ko", card.ko, "ko", card.key, { noToggle: true }) : null
        ]);
      }

      function fitFsEnglish(cardEl) {
        if (!cardEl) return;
        const en = cardEl.querySelector(".fs-en");
        if (!en) return;
        en.style.fontSize = "";
        const minPx = 20;
        let size = parseFloat(window.getComputedStyle(en).fontSize) || 0;
        let guard = 0;
        while (cardEl.scrollHeight > cardEl.clientHeight + 1 && size > minPx && guard++ < 14) {
          size *= 0.92;
          en.style.fontSize = size + "px";
        }
      }

      function playFsCard(card) {
        if (!card) return;
        if (hasSpeech && card.en) speakSingle(card.en);
      }

      const fs = {
        root: null,
        progress: null,
        toggles: null,
        autoBtn: null,
        stage: null,
        actions: null,
        playBtn: null,
        animTimer: 0
      };

      const FS_SESSION_KEY = "travel-english-pwa-fs";
      let locQuiet = false;

      function parseLocation() {
        const hash = location.hash || "";
        let m = hash.match(/^#lesson=(\d{4}-\d{2}-\d{2})(?:&study=(\d+))?$/);
        if (!m) m = hash.match(/^#lesson\/(\d{4}-\d{2}-\d{2})(?:\/study\/(\d+))?$/);
        if (!m) return { date: null, study: null };
        const study = m[2] != null ? parseInt(m[2], 10) : null;
        return { date: m[1], study: Number.isFinite(study) ? study : null };
      }

      function lessonHash(date, study) {
        if (!date) return location.pathname + location.search;
        return study == null ? "#lesson=" + date : "#lesson=" + date + "&study=" + study;
      }

      function setLocation(url, mode) {
        const current = url.charAt(0) === "#" ? location.hash : (location.pathname + location.search + location.hash);
        if (mode !== "push" && current === url) return;
        locQuiet = true;
        try {
          if (mode === "push") history.pushState({ study: /study/.test(url) }, "", url);
          else history.replaceState({ study: /study/.test(url) }, "", url);
        } finally {
          locQuiet = false;
        }
      }

      function writeStudySession() {
        try {
          if (state.fsOpen && state.openDate) {
            sessionStorage.setItem(FS_SESSION_KEY, JSON.stringify({
              date: state.openDate,
              index: state.fsIndex,
              showAllKo: state.showAllKo,
              showAllEn: state.showAllEn
            }));
          } else {
            sessionStorage.removeItem(FS_SESSION_KEY);
          }
        } catch {}
      }

      function readStudySession() {
        try {
          const raw = sessionStorage.getItem(FS_SESSION_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed.date !== "string") return null;
          const index = Number(parsed.index);
          return {
            date: parsed.date,
            index: Number.isFinite(index) ? index : 0,
            showAllKo: typeof parsed.showAllKo === "boolean" ? parsed.showAllKo : null,
            showAllEn: typeof parsed.showAllEn === "boolean" ? parsed.showAllEn : null
          };
        } catch {
          return null;
        }
      }

      function showStudyUi() {
        window.scrollTo(0, 0);
        document.body.classList.add("fs-open");
        if (fs.root) {
          fs.root.classList.add("is-open");
          fs.root.setAttribute("aria-hidden", "false");
        }
        renderFs(0);
        try { if (fs.root) fs.root.focus(); } catch {}
      }

      function hideStudyUi() {
        state.fsOpen = false;
        state.fsAnimating = false;
        if (fs.animTimer) {
          window.clearTimeout(fs.animTimer);
          fs.animTimer = 0;
        }
        if (fs.root) {
          fs.root.classList.remove("is-open");
          fs.root.setAttribute("aria-hidden", "true");
        }
        document.body.classList.remove("fs-open");
        writeStudySession();
      }

      function openFullscreen(index) {
        const lesson = currentOpenLesson();
        if (!lesson) return;
        const cards = getFsCards(lesson);
        if (!cards.length) return;
        if (state.speaking) stopSpeech();
        state.fsOpen = true;
        state.fsIndex = Math.max(0, Math.min(index || 0, cards.length - 1));
        writeStudySession();
        const loc = parseLocation();
        const url = lessonHash(state.openDate, state.fsIndex);
        if (loc.date === state.openDate && loc.study != null) {
          setLocation(url, "replace");
        } else {
          setLocation(url, "push");
          state.fsPushed = true;
        }
        showStudyUi();
      }

      function closeFullscreen(opts) {
        const silent = opts && opts.silent;
        const fromPop = opts && opts.fromPop;
        const keepHash = opts && opts.keepHash;
        const wasOpen = state.fsOpen || (fs.root && fs.root.classList.contains("is-open"));
        if (!wasOpen) {
          if (!keepHash && !fromPop) {
            const loc = parseLocation();
            if (loc.study != null) setLocation(lessonHash(loc.date || state.openDate, null), "replace");
          }
          writeStudySession();
          if (!silent) render();
          return;
        }
        stopSpeech();
        hideStudyUi();
        if (!fromPop && !keepHash) {
          const loc = parseLocation();
          if (loc.study != null) {
            if (state.fsPushed) {
              state.fsPushed = false;
              locQuiet = true;
              history.back();
              window.setTimeout(() => { locQuiet = false; }, 0);
            } else {
              setLocation(lessonHash(state.openDate || loc.date, null), "replace");
            }
          }
        }
        if (!fromPop) state.fsPushed = false;
        if (!silent) render();
      }

      function moveFs(dir) {
        if (!state.fsOpen || state.fsAnimating) return;
        const lesson = currentOpenLesson();
        const cards = getFsCards(lesson);
        const next = state.fsIndex + dir;
        if (next < 0) {
          goAdjacentLessonFromFs(-1);
          return;
        }
        if (next >= cards.length) {
          goAdjacentLessonFromFs(1);
          return;
        }
        state.fsIndex = next;
        writeStudySession();
        setLocation(lessonHash(state.openDate, state.fsIndex), "replace");
        stopSpeech();
        renderFs(dir);
        if (state.fsAutoplay && hasSpeech) {
          const spoken = cards[state.fsIndex].en;
          window.setTimeout(() => {
            if (state.fsOpen && state.fsAutoplay) speakSingle(spoken);
          }, 280);
        }
      }

      function goAdjacentLessonFromFs(dir) {
        const lesson = currentOpenLesson();
        const target = dir > 0 ? getNextLessonByDate(lesson) : getPrevLessonByDate(lesson);
        if (!target) return;
        openLesson(target.date, { keepFs: true, fsIndex: dir > 0 ? 0 : -1 });
      }

      function renderFs(animDir) {
        const lesson = currentOpenLesson();
        if (!state.fsOpen || !lesson || !fs.root) return;
        const cards = getFsCards(lesson);
        if (!cards.length) {
          closeFullscreen({ silent: true });
          return;
        }
        if (state.fsIndex >= cards.length) state.fsIndex = cards.length - 1;
        if (state.fsIndex < 0) state.fsIndex = 0;
        const card = cards[state.fsIndex];

        fs.progress.textContent = (state.fsIndex + 1) + " / " + cards.length;
        fs.toggles.replaceChildren(...langToggleButtons());
        fs.autoBtn.classList.toggle("is-on", state.fsAutoplay);
        fs.autoBtn.setAttribute("aria-pressed", state.fsAutoplay ? "true" : "false");
        const dockKids = [];
        if (fs.playBtn) dockKids.push(fs.playBtn);
        dockKids.push(fsGoogleLink(card.en));
        fs.actions.replaceChildren(...dockKids);
        setFsPlayIcon();

        const node = buildFsCard(card);
        const stage = fs.stage;
        const current = stage.querySelector(".fs-card");
        const dir = animDir || 0;
        if (!current || !dir || state.fsAnimating) {
          if (fs.animTimer) {
            window.clearTimeout(fs.animTimer);
            fs.animTimer = 0;
          }
          state.fsAnimating = false;
          stage.replaceChildren(node);
          fitFsEnglish(node);
          return;
        }

        state.fsAnimating = true;
        node.classList.add(dir > 0 ? "is-from-right" : "is-from-left");
        current.classList.add(dir > 0 ? "is-to-left" : "is-to-right");
        stage.appendChild(node);
        fitFsEnglish(node);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            node.classList.add("is-in");
          });
        });
        if (fs.animTimer) window.clearTimeout(fs.animTimer);
        fs.animTimer = window.setTimeout(() => {
          if (current.parentNode) current.remove();
          node.classList.remove("is-from-right", "is-from-left", "is-in");
          state.fsAnimating = false;
          fs.animTimer = 0;
        }, 320);
      }

      function initFullscreen() {
        fs.root = el("div", {
          id: "fs-overlay",
          class: "fs-overlay",
          role: "dialog",
          "aria-modal": "true",
          "aria-label": "전체화면 보기",
          "aria-hidden": "true",
          tabindex: "-1"
        });

        fs.progress = el("span", { class: "fs-progress" });
        fs.toggles = el("div", { class: "fs-top-actions toolbar-lang-row" });
        fs.autoBtn = el("button", {
          type: "button",
          class: "toggle-btn",
          text: "▶ 자동",
          "aria-label": "카드 바꿀 때 자동 듣기",
          "aria-pressed": "false",
          onClick: () => {
            state.fsAutoplay = !state.fsAutoplay;
            fs.autoBtn.classList.toggle("is-on", state.fsAutoplay);
            fs.autoBtn.setAttribute("aria-pressed", state.fsAutoplay ? "true" : "false");
            if (state.fsAutoplay && !state.speaking) {
              const lesson = currentOpenLesson();
              const cards = getFsCards(lesson);
              const card = cards[state.fsIndex];
              if (card) speakSingle(card.en);
            }
          }
        });
        if (!hasSpeech) fs.autoBtn.hidden = true;

        const closeBtn = el("button", {
          type: "button",
          class: "fs-icon-btn",
          text: "✕",
          "aria-label": "전체화면 닫기",
          onClick: () => closeFullscreen()
        });

        const top = el("div", { class: "fs-top" }, [
          fs.progress,
          el("div", { class: "fs-top-actions" }, [
            fs.toggles,
            fs.autoBtn,
            closeBtn
          ])
        ]);

        fs.stage = el("div", { class: "fs-stage" });

        fs.playBtn = hasSpeech
          ? el("button", {
              id: "fs-play-btn",
              type: "button",
              class: "fs-dock-btn fs-dock-play",
              "aria-label": "듣기",
              title: "듣기",
              onClick: () => {
                const lesson = currentOpenLesson();
                const card = getFsCards(lesson)[state.fsIndex];
                if (!card) return;
                if (state.speaking) {
                  stopSpeech();
                  updateSpeakingUI();
                } else {
                  speakSingle(card.en);
                }
              }
            })
          : null;
        fs.actions = el("div", { class: "fs-actions" });
        const bottom = el("div", { class: "fs-bottom" }, [
          fs.actions
        ]);
        setFsPlayIcon();

        fs.root.append(top, fs.stage, bottom);
        document.body.appendChild(fs.root);

        const SWIPE_X = 56;
        const TAP_MOVE = 14;
        const TAP_MS = 500;
        let ptr = null;
        fs.stage.addEventListener("pointerdown", (e) => {
          if (e.button != null && e.button !== 0) return;
          if (e.target.closest("button, a")) return;
          ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, t: Date.now(), locked: false, target: e.target };
        });
        fs.stage.addEventListener("pointermove", (e) => {
          if (!ptr || e.pointerId !== ptr.id) return;
          const dx = e.clientX - ptr.x;
          const dy = e.clientY - ptr.y;
          if (!ptr.locked && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) {
            ptr.locked = true;
            try { fs.stage.setPointerCapture(e.pointerId); } catch {}
          }
          if (ptr.locked) e.preventDefault();
        });
        const endPtr = (e) => {
          if (!ptr || e.pointerId !== ptr.id) return;
          const dx = e.clientX - ptr.x;
          const dy = e.clientY - ptr.y;
          const dt = Date.now() - ptr.t;
          const locked = ptr.locked;
          const startTarget = ptr.target;
          ptr = null;
          if (locked) {
            if (Math.abs(dx) >= SWIPE_X && Math.abs(dx) > Math.abs(dy)) {
              moveFs(dx < 0 ? 1 : -1);
            }
            return;
          }
          if (Math.hypot(dx, dy) < TAP_MOVE && dt < TAP_MS) {
            const langEl = startTarget && startTarget.closest && startTarget.closest("[data-lang]");
            if (langEl && fs.stage.contains(langEl)) {
              toggleLangLine(langEl.getAttribute("data-lang"), langEl.getAttribute("data-lang-key"));
              return;
            }
            const lesson = currentOpenLesson();
            playFsCard(getFsCards(lesson)[state.fsIndex]);
          }
        };
        fs.stage.addEventListener("pointerup", endPtr);
        fs.stage.addEventListener("pointercancel", () => { ptr = null; });

        window.addEventListener("keydown", (e) => {
          if (!state.fsOpen) return;
          if (e.key === "Escape") {
            e.preventDefault();
            closeFullscreen();
          } else if (e.key === "ArrowLeft") {
            e.preventDefault();
            moveFs(-1);
          } else if (e.key === "ArrowRight") {
            e.preventDefault();
            moveFs(1);
          }
        });
      }

      function haystack(d) {
        return [
          d.title,
          d.dateLabel,
          d.date,
          d.intro,
          d.subtitle,
          d.category,
          ...d.dialogue.map((l) => l.speaker + " " + l.text),
          ...d.meaning.map((l) => l.speaker + " " + l.text),
          ...d.expressions.map((e) => e.en + " " + e.ko),
          d.practice,
          d.practiceNote || ""
        ].join("\n").toLowerCase();
      }

      function stopSpeech() {
        if (hasSpeech) {
          window.speechSynthesis.cancel();
        }
        state.speaking = false;
        state.speakingLineIdx = -1;
      }

      function pickVoice() {
        if (!hasSpeech) return null;
        const voices = window.speechSynthesis.getVoices();
        return (
          voices.find((v) => v.lang === "en-US" && v.localService) ||
          voices.find((v) => v.lang === "en-US") ||
          voices.find((v) => v.lang && v.lang.startsWith("en")) ||
          null
        );
      }

      function speakSingle(text) {
        if (!hasSpeech) return;
        stopSpeech();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "en-US";
        u.rate = RATES[state.rateIdx];
        const v = pickVoice();
        if (v) u.voice = v;
        u.onend = () => {
          state.speaking = false;
          state.speakingLineIdx = -1;
          updateSpeakingUI();
        };
        u.onerror = () => {
          state.speaking = false;
          state.speakingLineIdx = -1;
          updateSpeakingUI();
        };
        state.speaking = true;
        window.speechSynthesis.speak(u);
        updateSpeakingUI();
      }

      function speakDialogue(lines) {
        if (!hasSpeech) return;
        if (state.speaking) {
          stopSpeech();
          updateSpeakingUI();
          return;
        }
        stopSpeech();
        const voice = pickVoice();
        const rate = RATES[state.rateIdx];
        state.speaking = true;
        let idx = 0;

        const next = () => {
          if (!state.speaking || idx >= lines.length) {
            state.speaking = false;
            state.speakingLineIdx = -1;
            updateSpeakingUI();
            return;
          }
          state.speakingLineIdx = idx;
          updateSpeakingUI();
          const u = new SpeechSynthesisUtterance(lines[idx]);
          u.lang = "en-US";
          u.rate = rate;
          if (voice) u.voice = voice;
          u.onend = () => {
            idx += 1;
            next();
          };
          u.onerror = () => {
            state.speaking = false;
            state.speakingLineIdx = -1;
            updateSpeakingUI();
          };
          window.speechSynthesis.speak(u);
        };
        next();
      }

      function speakingChromeInsets() {
        let top = 0;
        let bottom = 0;
        document.querySelectorAll(".detail-toolbar, .detail-topbar, .bottom-bar").forEach((el) => {
          if (el.hidden) return;
          const pos = window.getComputedStyle(el).position;
          if (pos !== "fixed" && pos !== "sticky") return;
          const r = el.getBoundingClientRect();
          if (r.bottom > 0 && r.top < window.innerHeight * 0.45) {
            top = Math.max(top, r.bottom);
          }
          if (r.top < window.innerHeight && r.bottom > window.innerHeight * 0.55) {
            bottom = Math.max(bottom, window.innerHeight - r.top);
          }
        });
        return { top, bottom };
      }

      function scrollSpeakingLineIntoView() {
        if (state.fsOpen || !state.speaking || state.speakingLineIdx < 0) return;
        const node = document.querySelector('.bubble[data-line-idx="' + state.speakingLineIdx + '"]');
        if (!node) return;
        const rect = node.getBoundingClientRect();
        const chrome = speakingChromeInsets();
        const edge = 48;
        const visTop = chrome.top + edge;
        const visBottom = window.innerHeight - chrome.bottom - edge;
        if (rect.top >= visTop && rect.bottom <= visBottom) return;
        const visMid = (chrome.top + (window.innerHeight - chrome.bottom)) / 2;
        const elMid = (rect.top + rect.bottom) / 2;
        const delta = elMid - visMid;
        if (Math.abs(delta) < 8) return;
        window.scrollBy({ top: delta, behavior: "smooth" });
      }

      function updateSpeakingUI() {
        const playBtn = document.getElementById("play-all-btn");
        if (playBtn) {
          playBtn.textContent = state.speaking ? "■ 중지" : "▶ 전체 듣기";
          playBtn.setAttribute("aria-label", state.speaking ? "전체 듣기 중지" : "전체 듣기");
        }
        setFsPlayIcon();
        document.querySelectorAll("[data-line-idx]").forEach((node) => {
          const idx = Number(node.getAttribute("data-line-idx"));
          node.classList.toggle("is-speaking", state.speaking && idx === state.speakingLineIdx);
        });
        scrollSpeakingLineIntoView();
      }

      function getFiltered() {
        const q = state.query.trim().toLowerCase();
        const newestFirst = [...state.lessons].reverse();
        const bySearch = q ? newestFirst.filter((d) => haystack(d).includes(q)) : newestFirst;
        const byStatus = bySearch.filter((d) => {
          if (state.statusFilter === "studied") return Boolean(state.studied[d.date]);
          if (state.statusFilter === "unstudied") return !state.studied[d.date];
          if (state.statusFilter === "favorite") return Boolean(state.favorite[d.date]);
          return true;
        });
        const counts = {};
        for (const cat of CATEGORIES) counts[cat] = 0;
        counts["전체"] = byStatus.length;
        for (const d of byStatus) counts[d.category] = (counts[d.category] || 0) + 1;

        const final = state.category === "전체"
          ? byStatus
          : byStatus.filter((d) => d.category === state.category);
        return { final, counts };
      }

      function openLesson(date, opts) {
        const keepFs = Boolean(opts && opts.keepFs);
        stopSpeech();
        if (state.fsOpen && !keepFs) closeFullscreen({ silent: true, keepHash: true });
        state.openDate = date;
        state.openKo = {};
        state.openEn = {};
        if (keepFs && date) {
          state.fsOpen = true;
          const requested = opts && Number.isFinite(Number(opts.fsIndex)) ? Number(opts.fsIndex) : 0;
          const cards = getFsCards(state.lessons.find((d) => d.date === date));
          state.fsIndex = requested < 0 ? Math.max(0, cards.length - 1) : Math.max(0, Math.min(requested, Math.max(cards.length - 1, 0)));
          writeStudySession();
        }
        const target = date ? lessonHash(date, keepFs ? state.fsIndex : null) : (location.pathname + location.search);
        const atTarget = date ? location.hash === target : !location.hash;
        if (!atTarget) {
          setLocation(target, "push");
          if (keepFs) state.fsPushed = true;
        } else if (keepFs) {
          setLocation(target, "replace");
        }
        window.scrollTo(0, 0);
        render();
      }

      function toggleStudied(date) {
        if (state.studied[date]) delete state.studied[date];
        else state.studied[date] = true;
        saveState();
        render();
      }

      function toggleFavorite(date) {
        if (state.favorite[date]) delete state.favorite[date];
        else state.favorite[date] = true;
        saveState();
        render();
      }

                            onClick: () => speakSingle(line.text)
                          })
                        : null,
                      googleStudyLink(line.text)
                    ])
                  ]),
                  langText("p", "bubble-en", line.text, "en", "line-" + i),
                  m ? langText("p", "bubble-ko", m.text, "ko", "line-" + i) : null
                ])
              ]);
            })
          )
        ]);

        const exprSection = el("section", { class: "section-card" }, [
          el("h2", { class: "section-heading", text: "핵심 표현" }),
          el("div", { class: "expr-grid" },
            lesson.expressions.map((item, i) =>
              el("div", { class: "expr-card" }, [
                el("div", {}, [
                  langText("p", "expr-en", item.en, "en", "expr-" + i),
                  langText("p", "expr-ko", item.ko, "ko", "expr-" + i)
                ]),
                el("div", { class: "expr-actions" }, [
                  hasSpeech
                    ? el("button", {
                        type: "button",
                        class: "mini-btn",
                        "aria-label": `${item.en} 듣기`,
                        text: "▶",
                        onClick: () => speakSingle(item.en)
                      })
                    : null,
                  googleStudyLink(item.en)
                ])
              ])
            )
          )
        ]);

        const practiceSection = el("section", { class: "section-card" }, [
          el("h2", { class: "section-heading", text: "따라 말해 보기" }),
          el("div", { class: "practice-box" }, [
            langText("p", "practice-en", lesson.practice, "en", "practice"),
            el("div", { class: "practice-actions" }, [
              hasSpeech
                ? el("button", {
                    type: "button",
                    class: "btn btn-primary",
                    text: "▶ 이 문장 듣기",
                    onClick: () => speakSingle(lesson.practice)
                  })
                : null,
              googleStudyLink(lesson.practice)
            ])
          ]),
          lesson.practiceNote
            ? el("p", { class: "practice-note", text: lesson.practiceNote })
            : null
        ]);

        const bottomNav = el("nav", { class: "bottom-bar", "aria-label": "대화 이동" }, [
          el("div", { class: "bottom-inner" }, [
            el("button", {
              type: "button",
              class: "btn",
              disabled: !prevLesson,
              text: "← 이전",
              onClick: () => prevLesson && openLesson(prevLesson.date)
            }),
            el("button", {
              type: "button",
              class: "btn",
              text: "목록",
              onClick: () => openLesson(null)
            }),
            el("button", {
              type: "button",
              class: "btn btn-primary",
              disabled: !nextLesson,
              text: "다음 →",
              onClick: () => nextLesson && openLesson(nextLesson.date)
            })
          ])
        ]);

        appEl.replaceChildren(topbar, header, toolbar, chatSection, exprSection, practiceSection, bottomNav);
      }

      function render() {
        if (state.loading) {
          appEl.replaceChildren(
            el("div", { class: "empty-state", text: "대화 목록을 불러오는 중..." })
          );
          return;
        }
        if (state.error) {
          appEl.replaceChildren(
            el("div", { class: "empty-state" }, [
              el("p", { text: "대화를 불러오지 못했어요: " + state.error }),
              el("button", { type: "button", class: "btn", text: "다시 시도", onClick: initData })
            ])
          );
          return;
        }
        if (state.openDate) {
          const found = state.lessons.find((d) => d.date === state.openDate);
          if (found) {
            renderDetail(found);
            if (state.fsOpen) showStudyUi();
            return;
          }
        }
        if (state.speaking) stopSpeech();
        if (state.fsOpen) closeFullscreen({ silent: true, keepHash: true });
        renderHome();
      }

      function desiredLocation(allowSession) {
        const loc = parseLocation();
        if (loc.date && loc.study != null) return loc;
        if (allowSession) {
          const sess = readStudySession();
          if (sess && sess.date && (!loc.date || sess.date === loc.date)) {
            return { date: loc.date || sess.date, study: sess.index };
          }
        }
        return loc;
      }

      function syncFromLocation(opts) {
        if (locQuiet || state.loading) return;
        const allowSession = Boolean(opts && opts.allowSession);
        const loc = desiredLocation(allowSession);
        if (loc.date !== state.openDate) {
          stopSpeech();
          if (state.fsOpen && loc.study == null) hideStudyUi();
          state.openDate = loc.date;
          state.openKo = {};
          state.openEn = {};
          if (loc.study == null) state.fsPushed = false;
        }
        if (loc.date && loc.study != null) {
          const lesson = state.lessons.find((d) => d.date === loc.date);
          if (lesson) {
            const last = Math.max(0, getFsCards(lesson).length - 1);
            state.fsOpen = true;
            state.fsIndex = Math.max(0, Math.min(loc.study, last));
            const sess = readStudySession();
            if (sess && sess.date === loc.date) {
              if (sess.showAllKo != null && typeof state.showAllKo === "boolean" && allowSession) {
                /* 가/A already come from localStorage; session is a backup if hash restore happens mid-session */
              }
            }
            writeStudySession();
            const url = lessonHash(state.openDate, state.fsIndex);
            if (location.hash !== url) setLocation(url, "replace");
          }
        } else if (state.fsOpen) {
          closeFullscreen({ silent: true, fromPop: true });
        }
        render();
      }

      function restoreStudyIfNeeded() {
        if (locQuiet || state.loading || !state.lessons.length) return;
        const loc = desiredLocation(true);
        if (!loc.date || loc.study == null) return;
        if (state.openDate !== loc.date) {
          syncFromLocation({ allowSession: true });
          return;
        }
        if (!state.fsOpen || !fs.root || !fs.root.classList.contains("is-open")) {
          state.fsOpen = true;
          state.fsIndex = loc.study;
          writeStudySession();
          const url = lessonHash(loc.date, state.fsIndex);
          if (location.hash !== url) setLocation(url, "replace");
          render();
        }
      }

      async function initData() {
        state.loading = true;
        state.error = null;
        render();
        try {
          const res = await fetch("./data/lessons.json");
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          state.lessons = await res.json();
          state.loading = false;
          syncFromLocation({ allowSession: true });
        } catch (err) {
          state.loading = false;
          state.error = err && err.message ? err.message : String(err);
          render();
        }
      }

      window.addEventListener("hashchange", () => syncFromLocation());
      window.addEventListener("popstate", () => syncFromLocation());
      window.addEventListener("pageshow", () => restoreStudyIfNeeded());
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") restoreStudyIfNeeded();
      });
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        state.installPrompt = e;
        if (!state.openDate) render();
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").then((reg) => {
            if (reg.active || navigator.serviceWorker.controller) {
              state.offlineReady = true;
              if (!state.openDate) render();
            }
            reg.addEventListener("updatefound", () => {
              const nw = reg.installing;
              if (!nw) return;
              nw.addEventListener("statechange", () => {
                if (nw.state === "activated") {
                  state.offlineReady = true;
                  if (!state.openDate) render();
                }
              });
            });
          }).catch(() => {});
        });
      }

      initFullscreen();
      initData();
    })();
  </script>
</body>
</html>
