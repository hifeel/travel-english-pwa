<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>여행 영어 대화 모음</title>
  <meta name="description" content="매일 아침 여행 영어 대화 102개 모음 — 검색, 분류, 영어 듣기, 오프라인 학습 지원" />
  <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121518" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="여행 영어" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <style>
    :root {
      --bg: #f7f4ee;
      --surface: #ffffff;
      --surface-subtle: #f0ece3;
      --surface-you: #e7f2f6;
      --surface-practice: #fdf6e9;
      --border: #e3ddd1;
      --border-strong: #cfc7b8;
      --text: #1b1f24;
      --text-secondary: #535a63;
      --text-tertiary: #7b828c;
      --accent: #1a5f76;
      --accent-hover: #144d60;
      --accent-soft: #e2f0f5;
      --accent-text: #ffffff;
      --gold: #b45309;
      --gold-soft: #fef3dc;
      --green: #157347;
      --green-soft: #e7f6ed;
      --miss: #b42318;
      --miss-soft: #fdecea;
      --shadow-sm: 0 1px 2px rgba(27, 31, 36, 0.04);
      --shadow-md: 0 6px 20px rgba(27, 31, 36, 0.07);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --max-w: 840px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121518;
        --surface: #1b2026;
        --surface-subtle: #232a32;
        --surface-you: #17303b;
        --surface-practice: #2a2417;
        --border: #2c333c;
        --border-strong: #3d4754;
        --text: #eef1f4;
        --text-secondary: #adb5bf;
        --text-tertiary: #7d8794;
        --accent: #67b7cf;
        --accent-hover: #83c7dc;
        --accent-soft: #1a333e;
        --accent-text: #0e1418;
        --gold: #f5b95b;
        --gold-soft: #312613;
        --green: #5fd18d;
        --green-soft: #142f20;
        --miss: #ff8a80;
        --miss-soft: #3a1b1b;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", "Pretendard", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    button, input {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));
    }

    /* Header */
    .hero {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .hero-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .hero h1 {
      margin: 0;
      font-size: 1.65rem;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .hero-sub {
      margin: 0;
      color: var(--text-secondary);
      font-size: 0.94rem;
    }

    .stats-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      box-shadow: var(--shadow-sm);
    }

    .stat-pill.is-offline {
      color: var(--green);
      background: var(--green-soft);
      border-color: transparent;
    }

    .install-btn {
      padding: 6px 13px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 0.84rem;
      font-weight: 650;
    }

    /* Search & filters */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 13px;
      color: var(--text-tertiary);
      pointer-events: none;
      font-size: 0.95rem;
    }

    .search-input {
      width: 100%;
      padding: 11px 38px 11px 38px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-clear {
      position: absolute;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: none;
      background: var(--surface-subtle);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    .chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-secondary);
      font-size: 0.84rem;
      font-weight: 550;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .chip:hover {
      border-color: var(--border-strong);
    }

    .chip.is-active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
      font-weight: 650;
    }

    .chip-count {
      font-size: 0.78rem;
      opacity: 0.78;
      font-variant-numeric: tabular-nums;
    }

    .subfilters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 4px;
      border-top: 1px solid var(--border);
    }

    .status-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .status-chip {
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: var(--surface-subtle);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 550;
    }

    .status-chip.is-active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 650;
    }

    .result-meta {
      font-size: 0.82rem;
      color: var(--text-tertiary);
    }

    /* Scene card grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .scene-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
      cursor: pointer;
    }

    .scene-card:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-strong);
    }

    .scene-card.is-studied {
      background: color-mix(in srgb, var(--surface) 50%, var(--bg));
      opacity: 0.6;
    }

    .scene-card.is-studied .card-title {
      color: var(--text-tertiary);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-tertiary);
    }

    .cat-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-subtle);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.77rem;
    }

    .card-marks {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .icon-mark {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-tertiary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.92rem;
    }

    .icon-mark:hover {
      background: var(--surface-subtle);
    }

    .icon-mark.is-fav {
      color: var(--gold);
      background: var(--gold-soft);
    }

    .icon-mark.is-done {
      color: var(--text-tertiary);
      background: transparent;
      opacity: 0.4;
    }

    .card-title {
      margin: 0;
      font-size: 1.06rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .card-sub {
      margin: 0;
      font-size: 0.88rem;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty-state {
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 36px 20px;
      text-align: center;
      color: var(--text-secondary);
    }

    .footer-note {
      margin-top: 22px;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: var(--surface-subtle);
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Single-dialogue detail view */
    .detail-topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
      transition: background 0.14s ease, border-color 0.14s ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-subtle);
    }

    .btn:disabled {
      opacity: 0.42;
      cursor: default;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-dual.is-on {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }
    .dual-note {
      align-self: center;
      font-size: 11px;
      opacity: 0.68;
      padding: 0 2px;
      white-space: nowrap;
    }

    .btn-done.is-on {
      background: var(--green-soft);
      border-color: var(--green);
      color: var(--green);
    }

    .btn-fav.is-on {
      background: var(--gold-soft);
      border-color: var(--gold);
      color: var(--gold);
    }

    .detail-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.84rem;
      color: var(--text-tertiary);
    }

    .detail-title {
      margin: 0 0 6px;
      font-size: 1.4rem;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .detail-intro {
      margin: 0;
      color: var(--text-secondary);
      font-size: 0.94rem;
    }

    .detail-toolbar {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 30;
      margin: 0 -16px 14px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .toggle-btn.is-on {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .toggle-btn.lang-toggle {
      min-width: 42px;
      justify-content: center;
      padding: 6px 10px;
      font-size: 1.08rem;
      font-weight: 800;
    }

    .is-blurred {
      filter: blur(5px);
      opacity: 0.6;
      user-select: none;
      -webkit-user-select: none;
    }

    [data-lang] {
      cursor: pointer;
    }

    .section-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    .section-heading {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Chat bubbles */
    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .bubble-row {
      display: flex;
      flex-direction: column;
      max-width: 90%;
    }

    .bubble-row.is-you {
      align-self: flex-end;
      align-items: flex-end;
    }

    .bubble-row.is-staff {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      width: 100%;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .bubble-row.is-you .bubble {
      background: var(--surface-you);
      border-bottom-right-radius: 5px;
    }

    .bubble-row.is-staff .bubble {
      border-bottom-left-radius: 5px;
    }

    .bubble.is-speaking {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .bubble-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .bubble-speaker {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-tertiary);
    }

    .bubble-actions {
      display: inline-flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 5px;
    }

    .mini-btn {
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .mini-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    a.mini-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-decoration: none;
      line-height: 1.3;
      white-space: nowrap;
    }

    .expr-actions,
    .practice-actions {
      display: inline-flex;
      flex-wrap: nowrap;
      align-items: center;
      flex-shrink: 0;
      gap: 6px;
    }

    .bubble-en {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 550;
      color: var(--text);
      overflow-wrap: break-word;
    }

    .bubble-ko {
      margin: 6px 0 0;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
      font-size: 0.89rem;
      color: var(--text-secondary);
    }

    .mini-btn.mic-btn {
      min-width: 2em;
      padding-left: 7px;
      padding-right: 7px;
    }

    .mini-btn.mic-btn.is-listening,
    .fs-dock-btn.is-listening {
      background: #d32f2f;
      border-color: #d32f2f;
      color: #fff;
      animation: mic-pulse 1.15s ease-in-out infinite;
    }

    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.55); }
      50% { box-shadow: 0 0 0 8px rgba(211, 47, 47, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .mini-btn.mic-btn.is-listening,
      .fs-dock-btn.is-listening { animation: none; }
    }

    .mic-result {
      margin: 8px 0 0;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.86rem;
      line-height: 1.45;
      text-align: left;
    }

    .mic-result[hidden] { display: none; }

    .mic-listen-label {
      margin: 0;
      font-weight: 700;
      color: #d32f2f;
    }

    .mic-live-text {
      margin: 5px 0 0;
      font-weight: 550;
      color: var(--text);
      overflow-wrap: break-word;
    }

    .mic-listen-hint {
      margin: 6px 0 0;
      font-size: 0.8rem;
      font-weight: 650;
      color: var(--text-secondary);
    }

    .mic-playback {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .fs-card .mic-playback {
      justify-content: center;
    }

    .mic-play-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px 3px 3px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 650;
    }

    .mic-play-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .mic-play-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-soft);
      color: var(--accent);
      flex: none;
    }

    .mic-play-icon svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .mic-playback .mic-clear-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06);
      color: rgba(234, 239, 247, 0.75);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .mic-play-btn.is-playing {
      border-color: var(--accent);
      color: var(--accent);
    }

    .mic-play-btn.is-playing .mic-play-icon {
      background: var(--accent);
      color: var(--accent-text);
    }

    .mic-notice {
      margin: 0;
      font-weight: 650;
      color: var(--gold);
    }

    .mic-diff,
    .mic-hints,
    .mic-heard,
    .mic-score {
      margin: 0;
    }

    .mic-diff + .mic-heard,
    .mic-hints + .mic-heard,
    .mic-diff + .mic-score,
    .mic-hints + .mic-score,
    .mic-heard + .mic-score,
    .mic-notice + .mic-diff,
    .mic-notice + .mic-hints,
    .mic-notice + .mic-heard,
    .mic-notice + .mic-score {
      margin-top: 5px;
    }

    .mic-word.is-match { color: var(--green); }
    .mic-word.is-miss {
      color: var(--miss);
      background: var(--miss-soft);
      border-radius: 4px;
      padding: 0 3px;
    }
    button.mic-word.is-miss {
      border: 0;
      font: inherit;
      cursor: pointer;
      text-decoration: underline dotted;
      text-underline-offset: 3px;
      -webkit-tap-highlight-color: transparent;
    }
    .word-coach {
      margin-top: 10px;
      padding: 11px 13px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);

      const CONTRACTIONS = {

        for (let i = 1; i <= n; i++) {
          for (let j = 1; j <= m; j++) {
            dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
          }
        }
        return dp[n][m];
      }

      function tokenEqual(a, b) {
        if (a === b) return true;
        const min = Math.min(a.length, b.length);
        return min >= 6 && editDistance(a, b) <= 1;
      }

      function alignTokens(a, b) {
        const n = a.length, m = b.length;
        const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));
        const bp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(null));
        for (let i = 0; i <= n; i++) { dp[i][0] = i; if (i) bp[i][0] = "del"; }
        for (let j = 0; j <= m; j++) { dp[0][j] = j; if (j) bp[0][j] = "ins"; }
        for (let i = 1; i <= n; i++) {
          for (let j = 1; j <= m; j++) {
            let best = dp[i - 1][j] + 1, how = "del";
            if (dp[i][j - 1] + 1 < best) { best = dp[i][j - 1] + 1; how = "ins"; }
            const c = dp[i - 1][j - 1] + (tokenEqual(a[i - 1], b[j - 1]) ? 0 : 1);
            if (c < best) { best = c; how = "sub"; }
            // one expected word heard as two words ("lunchtime" -> "lunch time")
            if (j >= 2 && tokenEqual(a[i - 1], b[j - 2] + b[j - 1]) && dp[i - 1][j - 2] < best) { best = dp[i - 1][j - 2]; how = "merge"; }
            // two expected words heard glued together ("lunch time" -> "lunchtime")
            if (i >= 2 && tokenEqual(a[i - 2] + a[i - 1], b[j - 1]) && dp[i - 2][j - 1] < best) { best = dp[i - 2][j - 1]; how = "split"; }
            dp[i][j] = best; bp[i][j] = how;
          }
        }
        const ops = [];
        let i = n, j = m;
        while (i > 0 || j > 0) {
          const how = bp[i][j];
          if (how === "sub") {
            ops.push({ type: tokenEqual(a[i - 1], b[j - 1]) ? "match" : "sub", a: a[i - 1], b: b[j - 1] });
            i--; j--;
          } else if (how === "del") {
            ops.push({ type: "del", a: a[i - 1] });
            i--;
          } else if (how === "ins") {
            ops.push({ type: "ins", b: b[j - 1] });
            j--;
          } else if (how === "merge") {
            ops.push({ type: "merge", a: a[i - 1], b: [b[j - 2], b[j - 1]] });
            i--; j -= 2;
          } else if (how === "split") {
            ops.push({ type: "split", a: [a[i - 2], a[i - 1]], b: b[j - 1] });
            i -= 2; j--;
          } else {
            break;
          }
        }
        ops.reverse();
        return ops;
      }

      function compareUtterance(expected, heard) {
        const parts = displayParts(expected);
        const heardTok = tokenizeHeard(heard);
        const origTok = [];
        const map = [];
        parts.forEach((part, idx) => {
          part.tokens.forEach((tok) => {
            origTok.push(tok);
            map.push(idx);
          });
        });
        const ops = alignTokens(origTok, heardTok);
        const partHits = parts.map((part) => ({ need: part.tokens.length, got: 0, heard: [] }));
        let oi = 0;
        for (const op of ops) {
          if (op.type === "ins") {
            if (map.length) partHits[Math.min(oi, map.length - 1)].heard.push(op.b);
            continue;
          }
          if (op.type === "match") partHits[map[oi]].got += 1;
          else if (op.type === "sub") partHits[map[oi]].heard.push(op.b);
          else if (op.type === "merge") partHits[map[oi]].got += 1;
          else if (op.type === "split") { partHits[map[oi]].got += 1; partHits[map[oi + 1]].got += 1; }
          oi += op.type === "split" ? 2 : 1;
        }
        const words = parts.map((part, idx) => ({
          display: part.display,
          ok: partHits[idx].need > 0 && partHits[idx].got === partHits[idx].need,
          heardAs: partHits[idx].heard.join(" ")
        }));
        const matched = words.filter((w) => w.ok).length;
        const percent = words.length ? Math.round((100 * matched) / words.length) : 0;
        const missed = words.filter((w) => !w.ok).map((w) => w.display);
        const exact = words.length > 0 && missed.length === 0;
        const near = exact || percent >= 90;
        return {
          heard: String(heard || "").trim(),
          words,
          missed,
          percent,
          exact,
          near,
          good: near
        };
      }

      // ---- Word coach: tap a misheard word for IPA + Korean approx + tips ----
      let pronData = null;
      let pronPromise = null;

      function ensurePron() {
        if (pronData) return Promise.resolve(pronData);
        if (!pronPromise) {
          pronPromise = fetch("./data/pronunciation.json")
            .then((r) => (r.ok ? r.json() : {}))
            .then((d) => { pronData = d || {}; return pronData; })
            .catch(() => { pronPromise = null; pronData = {}; return pronData; });
        }
        return pronPromise;
      }

      function pronNorm(s) {
        return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
      }

      const ONES = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine",
        "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
      const TENS = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];

      function numToWords(n) {
        if (n < 20) return ONES[n];
        if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? "-" + ONES[n % 10] : "");
        if (n < 1000) return ONES[Math.floor(n / 100)] + " hundred" + (n % 100 ? " " + numToWords(n % 100) : "");
        return ONES[Math.floor(n / 1000)] + " thousand" + (n % 1000 ? " " + numToWords(n % 1000) : "");
      }

      function lookupPron(display) {
        if (!pronData) { ensurePron(); return null; }
        const k = pronNorm(display);
        if (!k) return null;
        if (/^\d{1,6}$/.test(k) && k[0] !== "0") {
          const parts = numToWords(parseInt(k, 10)).split(/[\s-]+/);
          if (parts.length && parts.every((p) => pronData[p])) {
            return parts.map((p) => pronData[p]).join(" ");
          }
          return null;
        }
        return pronData[k] || pronData[k.replace(/s$/, "")] || null;
      }

      const PRON_IPA = {
        AA: "ɑ", AE: "æ", AH: "ʌ", AO: "ɔ", AW: "aʊ", AY: "aɪ", EH: "ɛ", ER: "ɝ",
        EY: "eɪ", IH: "ɪ", IY: "i", OW: "oʊ", OY: "ɔɪ", UH: "ʊ", UW: "u",
        P: "p", B: "b", T: "t", D: "d", K: "k", G: "ɡ", F: "f", V: "v",
        TH: "θ", DH: "ð", S: "s", Z: "z", SH: "ʃ", ZH: "ʒ", CH: "tʃ", JH: "dʒ",
        M: "m", N: "n", NG: "ŋ", L: "l", R: "ɹ", W: "w", HH: "h", Y: "j"
      };

      function ipaOf(phon) {
        return "/" + phon.split(/\s+/).map((p) => PRON_IPA[p.replace(/\d$/, "")] || p.toLowerCase()).join(" ") + "/";
      }

      // Korean approximation: phonemes -> jamo syllables (rough, labeled "대략")
      const KO_Y = 11;
      const KO_CHO = { G: 0, K: 15, T: 16, N: 2, D: 3, R: 5, L: 5, M: 6, B: 7, P: 17, S: 9, J: 12, CH: 14,
        H: 18, F: 17, V: 7, TH: 9, DH: 3, Z: 12, SH: 14, JH: 12, HH: 18 };
      const KO_JONG = { G: 0, K: 0, N: 3, D: 6, T: 6, TH: 6, DH: 6, R: 7, L: 7, M: 15, B: 16, P: 16,
        V: 16, F: 25, S: 18, Z: 18, SH: 18, J: 21, JH: 21, CH: 21, NG: 20 };
      const KO_VOW = { AA: [0], AE: [1], AH: [4], AO: [8], AW: [0, 13], AY: [0, 20], EH: [5], ER: [4],
        EY: [5, 20], IH: [20], IY: [20], OW: [8], OY: [8, 20], UH: [13], UW: [13] };
      const KO_YMAP = { AA: 2, AE: 3, AH: 6, AO: 12, UW: 17, UH: 17, IH: 20, IY: 20, ER: 4, EH: 7,
        AW: [2, 13], AY: [2, 20], OW: 12, OY: [12, 20] };
      const KO_WMAP = { AA: 9, AE: 10, EH: 10, AH: 14, AO: 14, UW: 13, UH: 13, IH: 16, IY: 16, ER: 14,
        AW: [9, 13], AY: [9, 20], OW: [14], OY: [8, 20] };
      const KO_DH_WORDS = {
        the: "더", this: "디스", that: "댓", these: "디즈", those: "도즈", them: "뎀",
        then: "덴", than: "댄", there: "데어", their: "데어", they: "데이", though: "도우",
        other: "아더", mother: "마더", father: "파더", weather: "웨더",
        is: "이즈", was: "와즈", were: "워", of: "어브", are: "아", or: "오",
        your: "유어", yours: "유어즈", thanks: "땡스", thank: "땡크", again: "어게인",
        year: "이어", with: "위스", without: "위더웃", it: "잇", oh: "오", o: "오", sir: "서", miss: "미스",
        dutyfree: "듀티프리", togo: "투고", foldout: "폴드아웃", nondrowsy: "논드로지", preordered: "프리오더드", usbc: "유에스비씨"
      };

      function koSyl(cho, jung, jong) { return String.fromCharCode(0xac00 + cho * 588 + jung * 28 + (jong < 0 ? 0 : jong)); }

      function koApprox(display, phon) {
        const k = pronNorm(display);
        if (KO_DH_WORDS[k]) return KO_DH_WORDS[k];
        const ph = phon.split(/\s+/);
        const base = (p) => p.replace(/\d+$/, "");
        const isV = (p) => p !== undefined && KO_VOW[base(p)] !== undefined;
        const syls = [];
        let glide = null;
        let lastVowelWasTense = true;
        for (let i = 0; i < ph.length; i++) {
          const b = base(ph[i]);
          if (isV(ph[i])) {
            let js = KO_VOW[b];
            if (glide === "Y" && KO_YMAP[b] !== undefined) js = [].concat(KO_YMAP[b]);
            else if (glide === "W" && KO_WMAP[b] !== undefined) js = [].concat(KO_WMAP[b]);
            glide = null;
            lastVowelWasTense = !(b === "IH" && /[1]/.test(ph[i]));
            js.forEach((v, vi) => syls.push({ c: null, v: v, j: -1, dip: vi > 0 }));
            continue;
          }
          if (b === "Y" || b === "W") {
            if (isV(ph[i + 1])) { glide = b; continue; }
            syls.push({ c: null, v: b === "Y" ? 20 : 13, j: -1 });
            continue;
          }
          if (b === "NG") {
            const p0 = syls[syls.length - 1];
            if (p0 && p0.v !== null && p0.j === -1 && p0.c !== undefined) { p0.j = 20; }
            else syls.push({ c: null, v: 18, j: 20 });
            continue;
          }
          const nextIsV = isV(ph[i + 1]);
          const p = syls[syls.length - 1];
          if (b === "R" && p && p.v !== null && p.j === -1 && !nextIsV) {
            const nx = base(ph[i + 1] || "");
            if (["T", "D", "K", "G"].includes(nx)) { p.rV = true; continue; }
            const prevPh = i > 0 ? base(ph[i - 1]) : "";
            if ((prevPh === "AA" || prevPh === "AH") && p.c === null) p.v = 0;
            else syls.push({ c: null, v: 4, j: -1, rV: true });
            continue;
          }
          const SIB = ["S", "Z", "SH", "CH", "JH", "J"].includes(b);
          const stop = ["T", "D", "K", "G"].includes(b);
          const noJong = (SIB || (stop && (p && (p.rV || (p.dip && p.v === 20)))));
          if (p && p.v !== null && p.j === -1 && !nextIsV && KO_JONG[b] !== undefined && !noJong) {
            if (p.v === 20 && lastVowelWasTense === false && b !== "NG") p.v = 0;
            p.j = KO_JONG[b]; continue;
          }
          syls.push({ c: KO_CHO[b] !== undefined ? KO_CHO[b] : KO_Y, v: null, j: -1 });
        }
        const out = [];
        for (let i = 0; i < syls.length; i++) {
          const s = syls[i];
          if (s.v === null) {
            const nxt = syls[i + 1];
            if (nxt && nxt.v !== null) {
              out.push(koSyl(s.c, nxt.v, nxt.j)); i += 1;
            } else {
              out.push(koSyl(s.c, 18, -1));
            }
          } else {
            out.push(koSyl(KO_Y, s.v, s.j));
          }
        }
        return out.join("");
      }

      const PRON_TIPS = [
        ["TH", "혀끝을 윗니 사이에 살짝 넣고 바람만 내세요. ㅌ·ㅅ으로 들리면 인식도 못 들어요."],
        ["DH", "TH와 같은 혀 위치에서 목을 울리세요. 한국어에 없는 '디·더' 계열 소리예요."],
        ["F", "윗니를 아랫입술에 대고 바람을 내세요. 입술만 여는 '피'로 들리면 인식되기 어렵습니다."],
        ["V", "F와 같은 위치에서 목을 울리세요. 'ㅂ'으로 들리기 쉬워요."],
        ["Z", "ㅅ을 내면서 목을 울리세요. ㅈ과 다른 소리예요."],
        ["SH", "혀를 입천장 쪽으로 말아 '씨'처럼 바람을 내세요."],
        ["AE", "입을 벌려 '애'로 — '에'와 구별해요."],
        ["IH", "짧고 느슨한 '이'. 길게 '이—' 하면 단어가 달라져요."],
        ["ER", "혀를 뒤로 말아 내는 '어' (floor·water의 -er)."],
        ["NG", "혀 뒤를 입천장에 대고 코로 '응'. 뒤에 '으'를 붙이지 말아요."],
        ["UW", "입술을 동그랗게 모은 길고 긴 '우'."],
        ["OW", "'오'에서 '우'로 넘어가는 소리. '오'로만 끝내지 말아요."],
        ["R", "혀를 굴리지 않고 입천장에 닿지 않게 — 한국어 ㄹ과 달라요."],
        ["L", "끝나기 직전 L은 혀끝을 윗니 뒤 잇몸에 붙여요."]
      ];

      function tipsFor(phon) {
        const set = new Set(phon.split(/\s+/).map((p) => p.replace(/\d$/, "")));
        return PRON_TIPS.filter((t) => set.has(t[0])).slice(0, 2).map((t) => t[1]);
      }

      function speakWordSlow(word, rate) {
        stopSpeech();
        if (!("speechSynthesis" in window)) return;
        const u = new SpeechSynthesisUtterance(word);
        u.lang = "en-US";
        const v = pickVoice();
        if (v) u.voice = v;
        u.rate = rate;
        window.speechSynthesis.speak(u);
      }

      function refreshCoachHosts(key) {
        document.querySelectorAll('.mic-result[data-mic-key="' + key + '"]').forEach((node) => {
          fillMicHost(node, key);
        });
      }

      function toggleWordCoach(key, display) {
        const word = pronNorm(display);
        if (state.wordCoach && state.wordCoach.key === key && state.wordCoach.word === word) {
          state.wordCoach = null;
        } else {
          state.wordCoach = { key, word };
          ensurePron().then(() => {
            if (state.wordCoach && state.wordCoach.key === key) refreshCoachHosts(key);
          });
        }
        refreshCoachHosts(key);
      }

      function wordCoachNode(key, w) {
        const box = el("div", { class: "word-coach" });
        box.appendChild(el("div", { class: "word-coach-word", text: w.display }));
        const phon = lookupPron(w.display);
        if (!phon) {
          box.appendChild(el("div", { class: "word-coach-note", text: "발음 사전에 없는 단어예요 — 재생으로 들어봐요." }));
        } else {
          box.appendChild(el("div", { class: "word-coach-ipa", text: ipaOf(phon) }));
          box.appendChild(el("div", { class: "word-coach-ko", text: "대략 발음: " + koApprox(w.display, phon) }));
          const tips = tipsFor(phon);
          if (tips.length) {
            const ul = el("ul", { class: "word-coach-tips" });
            tips.forEach((t) => ul.appendChild(el("li", { text: t })));
            box.appendChild(ul);
          }
        }
        if (w.heardAs && pronNorm(w.heardAs) !== pronNorm(w.display)) {
          const hPhon = lookupPron(w.heardAs);
          box.appendChild(el("div", {
            class: "word-coach-heard",
            text: "저는 \"" + w.heardAs + "\"" + (hPhon ? " (" + ipaOf(hPhon) + ")" : "") + "(으)로 들었어요."
          }));
        }
        const actions = el("div", { class: "word-coach-actions" });
        if ("speechSynthesis" in window && phon) {
          actions.appendChild(el("button", {
            type: "button", class: "mic-play-btn", text: "천천히 듣기",
            onClick: (e) => { e.preventDefault(); e.stopPropagation(); speakWordSlow(w.display, 0.45); }
          }));
          actions.appendChild(el("button", {
            type: "button", class: "mic-play-btn", text: "보통 속도",
            onClick: (e) => { e.preventDefault(); e.stopPropagation(); speakWordSlow(w.display, 0.95); }
          }));
        }
        actions.appendChild(el("button", {
          type: "button", class: "mic-play-btn", text: "닫기",
          onClick: (e) => { e.preventDefault(); e.stopPropagation(); state.wordCoach = null; refreshCoachHosts(key); }
        }));
        box.appendChild(actions);
        return box;
      }

      function expectedTextForKey(key) {
        const lesson = currentOpenLesson();
        if (!lesson || !key) return "";
        if (key === "practice") return lesson.practice || "";
        if (key.startsWith("line-")) {
          const i = Number(key.slice(5));
          return (lesson.dialogue[i] && lesson.dialogue[i].text) || "";
        }
        if (key.startsWith("expr-")) {
          const i = Number(key.slice(5));
          return (lesson.expressions[i] && lesson.expressions[i].en) || "";
        }
        return "";
      }

      function currentFsMicKey() {
        if (!state.fsOpen) return null;
        const lesson = currentOpenLesson();
        const card = getFsCards(lesson)[state.fsIndex];
        return card ? card.key : null;
      }

      const MIC_NOTICE = {
        unsupported: "이 브라우저에서는 마이크 인식이 안 돼요 (안드로이드 크롬 권장)",
        denied: "마이크 권한이 필요해요",
        "no-speech": "음성이 들리지 않았어요",
        error: "지금은 음성 인식을 할 수 없어요"
      };

      function fillMicHost(node, key) {
        if (!node || !key) return;
        const listening = state.micListening && state.micKey === key;
        const notice = state.micKey === key ? state.micNotice : null;
        const result = state.micResults[key];
        const recording = state.micRecordings[key];
        const interim = listening ? state.micInterim : "";
        const isFs = node.getAttribute("data-fs") === "1";
        const plain = isFs && plainActive && plainKey === key;
        const plainNotice = isFs && state.plainNotice && state.plainNotice.key === key ? state.plainNotice.text : "";
        node.replaceChildren();
        if (!listening && !plain && !notice && !plainNotice && !result && !(isFs && recording && recording.url)) {
          node.hidden = true;
          return;
        }
        node.hidden = false;
        if (plain) {
          const secs = Math.max(0, Math.min(PLAIN_MAX_MS, Date.now() - plainStartAt)) / 1000;
          const mm = String(Math.floor(secs / 60)).padStart(2, "0");
          const ss = String(Math.floor(secs % 60)).padStart(2, "0");
          node.appendChild(el("p", { class: "mic-listen-label", text: "⏺ 녹음 중… " + mm + ":" + ss }));
          node.appendChild(el("p", { class: "mic-listen-hint", text: "말을 마친 뒤 녹음 버튼을 다시 누르면 바로듣기가 나타나요" }));
          return;
        }
        if (plainNotice) {
          node.appendChild(el("p", { class: "mic-notice", text: plainNotice }));
        }
        if (listening) {
          node.appendChild(el("p", { class: "mic-listen-label", text: "듣는 중…" }));
          if (interim) node.appendChild(el("p", { class: "mic-live-text", text: interim }));
          node.appendChild(el("p", { class: "mic-listen-hint", text: "다시 눌러 중지" }));
          return;
        }
        if (notice) {
          node.appendChild(el("p", { class: "mic-notice", text: MIC_NOTICE[notice] || MIC_NOTICE.error }));
        }
        if (result) {
          const visible = isLangVisible("en", key);
          if (visible) {
            const diff = el("p", { class: "mic-diff" });
            result.words.forEach((w, i) => {
              if (i) diff.appendChild(document.createTextNode(" "));
              if (w.ok) {
                diff.appendChild(el("span", { class: "mic-word is-match", text: w.display }));
                return;
              }
              diff.appendChild(el("button", {
                type: "button",
                class: "mic-word is-miss word-tap",
                text: w.display,
                title: "발음 설명 보기",
                onClick: (ev) => {
                  ev.preventDefault();
                  ev.stopPropagation();
                  toggleWordCoach(key, w.display);
                }
              }));
            });
            node.appendChild(diff);
          } else if (!result.good && result.missed.length && result.missed.length <= 3 && result.missed.length < result.words.length / 2) {
            node.appendChild(el("p", { class: "mic-hints", text: "다른 단어: " + result.missed.join("  ·  ") }));
          }
          if (result.heard) {
            node.appendChild(el("p", { class: "mic-heard", text: "인식: " + result.heard }));
          }
          node.appendChild(el("p", {
            class: "mic-score " + (result.good ? "is-good" : "is-retry"),
            text: result.good ? "잘했어요! ✅" : ("다시 해 볼까요? " + result.percent + "%")
          }));
          if (state.wordCoach && state.wordCoach.key === key) {
            const cw = result.words.find((w) => !w.ok && pronNorm(w.display) === state.wordCoach.word);
            if (cw) node.appendChild(wordCoachNode(key, cw));
          }
        }
        const playback = isFs ? micPlaybackRow(key) : null;
        if (playback) node.appendChild(playback);
      }

      function micHost(key, fsFlag) {
        if (!hasRecognition && !hasRecorder) return null;
        const node = el("div", { class: "mic-result", "data-mic-key": key });
        if (fsFlag) node.setAttribute("data-fs", "1");
        fillMicHost(node, key);
        return node;
      }

      function micButton(key) {
        if (!hasRecognition) return null;
        const on = state.micListening && state.micKey === key;
        return el("button", {
          type: "button",
          class: "mini-btn mic-btn" + (on ? " is-listening" : ""),
          "data-mic-key": key,
          "aria-label": on ? "발음 확인 중지" : "발음 확인",
          "aria-pressed": on ? "true" : "false",
          title: "발음 확인",
          text: "🎤",
          onClick: (e) => {
            e.preventDefault();
            e.stopPropagation();
            toggleMic(key);
          }
        });
      }

      function updateMicUI() {
        document.querySelectorAll(".mic-btn[data-mic-key]").forEach((btn) => {
          const key = btn.getAttribute("data-mic-key");
          const on = state.micListening && state.micKey === key;
          btn.classList.toggle("is-listening", on);
          btn.setAttribute("aria-pressed", on ? "true" : "false");
          btn.setAttribute("aria-label", on ? "발음 확인 중지" : "발음 확인");
        });
        if (fs.recBtn) {
          const key = currentFsMicKey();
          const on = !!(key && plainActive && plainKey === key);
          fs.recBtn.classList.toggle("is-listening", on);
          fs.recBtn.setAttribute("aria-pressed", on ? "true" : "false");
        }
        if (fs.micBtn) {
          const key = currentFsMicKey();
          const on = state.micListening && key && state.micKey === key;
          fs.micBtn.classList.toggle("is-listening", on);
          fs.micBtn.setAttribute("aria-pressed", on ? "true" : "false");
          fs.micBtn.setAttribute("aria-label", on ? "발음 확인 중지" : "발음 확인");
          fs.micBtn.setAttribute("title", on ? "발음 확인 중지" : "발음 확인");
        }
        document.querySelectorAll(".mic-result[data-mic-key]").forEach((node) => {
          fillMicHost(node, node.getAttribute("data-mic-key"));
        });
      }

      function clearMicResults() {
        stopMicPlayback();
        revokeAllMicRecordings();
        state.micResults = {};
        state.wordCoach = null;
        state.micNotice = null;
        state.micInterim = "";
        state.micKey = null;
      }

      const MIC_SILENCE_MS = 2500;
      const MIC_MAX_MS = 15000;
      const MIC_MAX_RESTARTS = 20;

      let micRec = null;
      let micPendingKey = null;
      let micFinal = "";
      let micHeard = "";
      let micDiscard = false;
      let micFinished = false;
      let micWantStop = false;
      let micStartedAt = 0;
      let micLastResultAt = 0;
      let micRestartCount = 0;
      let micSilenceTimer = 0;
      let micCapTimer = 0;
      let micRestartTimer = 0;
      let micSessionId = 0;
      let micStream = null;
      let micRecorder = null;
      let micChunks = [];
      let micRecordMime = "";
      let micAudio = null;
      let micPlayingKey = null;

      let plainRec = null;
      let plainStream = null;
      let plainChunks = [];
      let plainMime = "";
      let plainKey = null;
      let plainActive = false;
      let plainSessionId = 0;
      let plainStartAt = 0;
      let plainCapTimer = 0;
      let plainTickTimer = 0;
      const PLAIN_MAX_MS = 30000;

      const HEADPHONE_ICON = "M12 1c-4.97 0-9 4.03-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2c0-3.87 3.13-7 7-7s7 3.13 7 7v2h-4v8h3c1.66 0 3-1.34 3-3v-7c0-4.97-4.03-9-9-9z";

      function canRecordDuringRecognition() {
        // Android Chrome often cuts off or aborts SpeechRecognition if
        // getUserMedia is opened at the same time. Prefer a stable check.
        return !/Android/i.test(navigator.userAgent || "");
