      function pickRecorderMime() {
        if (typeof MediaRecorder === "undefined" || typeof MediaRecorder.isTypeSupported !== "function") return "";
        const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/aac", "audio/ogg;codecs=opus"];
        for (let i = 0; i < types.length; i++) {
          if (MediaRecorder.isTypeSupported(types[i])) return types[i];
        }
        return "";
      }

      function releaseMicStream(stream) {
        const s = stream || micStream;
        if (!s) return;
        s.getTracks().forEach((track) => { try { track.stop(); } catch {} });
        if (!stream || stream === micStream) micStream = null;
      }

      function revokeMicRecording(key) {
        const rec = state.micRecordings[key];
        if (rec && rec.url) {
          try { URL.revokeObjectURL(rec.url); } catch {}
        }
        delete state.micRecordings[key];
      }

      function revokeAllMicRecordings() {
        abandonPlainRec();
        state.plainNotice = null;
        Object.keys(state.micRecordings || {}).forEach((key) => revokeMicRecording(key));
        state.micRecordings = {};
      }

      function stopMicPlayback() {
        if (micAudio) {
          try { micAudio.pause(); } catch {}
          micAudio = null;
        }
        micPlayingKey = null;
      }

      function playMicRecording(key) {
        const rec = state.micRecordings[key];
        if (!rec || !rec.url) return;
        if (state.speaking) {
          stopSpeech();
          updateSpeakingUI();
        }
        const same = micPlayingKey === key && micAudio && !micAudio.paused;
        stopMicPlayback();
        if (same) {
          updateMicUI();
          return;
        }
        const audio = new Audio(rec.url);
        micAudio = audio;
        micPlayingKey = key;
        audio.onended = () => {
          if (micAudio === audio) {
            micAudio = null;
            micPlayingKey = null;
            updateMicUI();
          }
        };
        audio.onerror = () => {
          if (micAudio === audio) {
            micAudio = null;
            micPlayingKey = null;
            updateMicUI();
          }
        };
        updateMicUI();
        const play = audio.play();
        if (play && typeof play.catch === "function") {
          play.catch(() => {
            if (micAudio === audio) {
              micAudio = null;
              micPlayingKey = null;
              updateMicUI();
            }
          });
        }
      }

      function releasePlainStream() {
        if (plainStream) {
          plainStream.getTracks().forEach((t) => t.stop());
          plainStream = null;
        }
      }

      function clearPlainTimers() {
        if (plainCapTimer) {
          window.clearTimeout(plainCapTimer);
          plainCapTimer = 0;
        }
        if (plainTickTimer) {
          window.clearInterval(plainTickTimer);
          plainTickTimer = 0;
        }
      }

      function stopPlainRec(opts) {
        clearPlainTimers();
        if (opts && opts.discard) plainSessionId += 1;
        plainActive = false;
        if (plainRec) {
          try {
            if (plainRec.state !== "inactive") plainRec.stop();
          } catch (err) {}
        }
        updateMicUI();
      }

      function abandonPlainRec() {
        if (!plainActive && !plainRec && !plainStream) return;
        stopPlainRec({ discard: true });
        releasePlainStream();
        plainRec = null;
        plainKey = null;
      }

      function togglePlainRec(key) {
        if (plainActive && plainKey === key) {
          stopPlainRec();
          return;
        }
        if (plainActive) stopPlainRec();
        if (state.micListening) stopMic({ silent: true });
        beginPlainRec(key);
      }

      function beginPlainRec(key) {
        if (!hasRecorder) return;
        if (state.speaking) {
          stopSpeech();
          updateSpeakingUI();
        }
        stopMicPlayback();
        revokeMicRecording(key);
        state.plainNotice = null;
        plainSessionId += 1;
        const session = plainSessionId;
        plainKey = key;
        plainActive = true;
        plainChunks = [];
        plainStartAt = Date.now();
        updateMicUI();
        navigator.mediaDevices
          .getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
          })
          .then((stream) => {
            if (session !== plainSessionId || !plainActive) {
              stream.getTracks().forEach((t) => t.stop());
              return;
            }
            plainStream = stream;
            const mime = pickRecorderMime();
            plainRec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
            plainMime = plainRec.mimeType || mime || "audio/webm";
            plainRec.ondataavailable = (e) => {
              if (e.data && e.data.size) plainChunks.push(e.data);
            };
            plainRec.onstop = () => {
              releasePlainStream();
              if (session !== plainSessionId) return;
              plainRec = null;
              const blob = new Blob(plainChunks, { type: plainMime });
              plainChunks = [];
              if (blob.size > 500) {
                state.micRecordings[key] = {
                  url: URL.createObjectURL(blob),
                  mime: plainMime,
                  dur: (Date.now() - plainStartAt) / 1000
                };
              } else {
                state.plainNotice = { key, text: "녹음에 실패했어요. 마이크 권한을 확인해 주세요." };
              }
              updateMicUI();
            };
            plainRec.onerror = () => {
              if (session !== plainSessionId) return;
              state.plainNotice = { key, text: "녹음 중 문제가 있었어요. 다시 시도해 주세요." };
              stopPlainRec({ discard: true });
            };
            plainRec.start();
            plainCapTimer = window.setTimeout(() => {
              plainCapTimer = 0;
              if (session === plainSessionId && plainActive) stopPlainRec();
            }, PLAIN_MAX_MS);
            plainTickTimer = window.setInterval(() => {
              if (session !== plainSessionId || !plainActive) return;
              updateMicUI();
            }, 1000);
          })
          .catch(() => {
            if (session !== plainSessionId) return;
            plainActive = false;
            plainKey = null;
            state.plainNotice = { key, text: "마이크 권한이 없어요. 브라우저 설정에서 마이크를 허용해 주세요." };
            updateMicUI();
          });
      }

      function micPlaybackRow(key) {
        if (state.micListening && state.micKey === key) return null;
        if (plainActive && plainKey === key) return null;
        const rec = state.micRecordings[key];
        const kids = [];
        if (rec && rec.url) {
          kids.push(el("button", {
            type: "button",
            class: "mic-play-btn" + (micPlayingKey === key ? " is-playing" : ""),
            "aria-label": "내 목소리 듣기",
            title: "내 목소리 듣기",
            onClick: (e) => {
              e.preventDefault();
              e.stopPropagation();
              playMicRecording(key);
            }
          }, [
            el("span", { class: "mic-play-icon" }, [svgIcon(HEADPHONE_ICON)]),
            el("span", { text: "내 목소리 듣기" })
          ]));
          kids.push(el("button", {
            type: "button",
            class: "mic-clear-btn",
            "aria-label": "녹음 삭제",
            title: "녹음 삭제",
            text: "지우기",
            onClick: (e) => {
              e.preventDefault();
              e.stopPropagation();
              revokeMicRecording(key);
              updateMicUI();
            }
          }));
        }
        if (!kids.length) return null;
        return el("div", { class: "mic-playback" }, kids);
      }

      function startMicRecording(session) {
        if (!canRecordDuringRecognition()) return;
        if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function") return;
        if (typeof MediaRecorder === "undefined") return;
        const mime = pickRecorderMime();
        navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then((stream) => {
          if (session !== micSessionId || micWantStop || micFinished || !state.micListening) {
            releaseMicStream(stream);
            return;
          }
          micStream = stream;
          micChunks = [];
          try {
            micRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
          } catch {
            releaseMicStream(stream);
            micRecorder = null;
            return;
          }
          micRecordMime = micRecorder.mimeType || mime || "audio/webm";
          micRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size) micChunks.push(e.data);
          };
          try {
            micRecorder.start(250);
          } catch {
            releaseMicStream(stream);
            micRecorder = null;
          }
        }).catch(() => {});
      }

      function stopMicRecording(key, opts) {
        const discard = Boolean(opts && opts.discard);
        const rec = micRecorder;
        const stream = micStream;
        const chunks = micChunks;
        const mime = micRecordMime || "audio/webm";
        micRecorder = null;
        micStream = null;
        micChunks = [];
        micRecordMime = "";

        const finishBlob = () => {
          releaseMicStream(stream);
          if (discard || !key || !chunks.length) return;
          let blob;
          try { blob = new Blob(chunks, { type: mime }); } catch { return; }
          if (!blob || blob.size < 200) return;
          const url = URL.createObjectURL(blob);
          if (state.micRecordings[key] && state.micRecordings[key].url) {
            try { URL.revokeObjectURL(state.micRecordings[key].url); } catch {}
          }
          state.micRecordings[key] = { url, mime };
          updateMicUI();
        };

        if (!rec || rec.state === "inactive") {
          finishBlob();
          return;
        }
        rec.onstop = finishBlob;
        try { rec.stop(); } catch { finishBlob(); }
      }

      function normSpeechText(s) {
        return String(s || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
      }

      function joinTranscript(a, b) {
        const left = String(a || "").trim();
        const right = String(b || "").trim();
        if (!right) return left;
        if (!left) return right;
        const nl = normSpeechText(left);
        const nr = normSpeechText(right);
        if (!nr) return left;
        if (!nl) return right;
        // Android Chrome restarts re-emit the same utterance with different
        // casing/punctuation; compare normalized so the echo is deduped.
        if (nl === nr || nl.endsWith(" " + nr)) return left;
        if (nr === nl || nr.startsWith(nl + " ")) return right;
        if (left.endsWith(right)) return left;
        if (right.startsWith(left) && (right.length === left.length || right.charAt(left.length) === " ")) return right;
        // Engine restart: the recognizer finalized a truncated chunk ("...around
        // the"), then re-emitted the SAME sentence from the beginning ("I think in
        // the restaurant around lunch time"). If right replays left's opening
        // (4+ shared leading words, covering half of left), it is a duplicate
        // take of one sentence — keep the fuller version, never concatenate.
        const lt = nl.split(" ");
        const rt = nr.split(" ");
        let lead = 0;
        while (lead < lt.length && lead < rt.length && lt[lead] === rt[lead]) lead += 1;
        if (lead >= 4 && lead * 2 >= lt.length) {
          return rt.length >= lt.length ? right : left;
        }
        return left + " " + right;
      }

      function clearMicTimers() {
        if (micSilenceTimer) { window.clearTimeout(micSilenceTimer); micSilenceTimer = 0; }
        if (micCapTimer) { window.clearTimeout(micCapTimer); micCapTimer = 0; }
        if (micRestartTimer) { window.clearTimeout(micRestartTimer); micRestartTimer = 0; }
      }

      function haltMicEngine() {
        const rec = micRec;
        if (!rec) return;
        try { rec.stop(); } catch { try { rec.abort(); } catch {} }
      }

      function finishMicAttempt(key, spoken) {
        const text = String(spoken || "").trim();
        if (!key) return;
        if (text) {
          const expected = expectedTextForKey(key);
          state.micResults[key] = compareUtterance(expected, text);
          if (state.micNotice === "no-speech") state.micNotice = null;
        } else if (!state.micNotice) {
          state.micNotice = "no-speech";
        }
      }

      function liveMicText() {
        return (micHeard || micFinal || state.micInterim || "").trim();
      }

      function targetFullyMatched(spoken) {
        const expected = expectedTextForKey(state.micKey);
        if (!expected || !String(spoken || "").trim()) return false;
        const result = compareUtterance(expected, spoken);
        return Boolean(result && (result.exact || result.percent === 100));
      }

      function armSilenceTimer() {
        if (micSilenceTimer) window.clearTimeout(micSilenceTimer);
        if (!(micFinal || micHeard)) return;
        micSilenceTimer = window.setTimeout(() => {
          micSilenceTimer = 0;
          if (!state.micListening || micWantStop || micFinished) return;
          if (!(micFinal || micHeard)) return;
          if (micLastResultAt && Date.now() - micLastResultAt < MIC_SILENCE_MS - 40) {
            armSilenceTimer();
            return;
          }
          endMicSession();
        }, MIC_SILENCE_MS);
      }

      function endMicSession(opts) {
        if (micFinished) {
          const queued = micPendingKey;
          if (queued) {
            micPendingKey = null;
            beginMic(queued);
          }
          return;
        }
        const discard = Boolean(opts && opts.discard) || micDiscard;
        const next = micPendingKey;
        micPendingKey = null;
        micFinished = true;
        micWantStop = true;
        micDiscard = discard;
        clearMicTimers();
        state.micListening = false;
        state.micInterim = "";
        haltMicEngine();
        const endedKey = state.micKey;
        if (discard) {
          micFinal = "";
          micHeard = "";
          stopMicRecording(null, { discard: true });
        } else {
          finishMicAttempt(endedKey, micFinal || micHeard);
          stopMicRecording(endedKey);
        }
        updateMicUI();
        if (next) beginMic(next);
      }

      function scheduleMicRestart() {
        if (micWantStop || micFinished || micDiscard || !state.micListening) return;
        if (Date.now() - micStartedAt >= MIC_MAX_MS) {
          endMicSession();
          return;
        }
        if (micRestartCount >= MIC_MAX_RESTARTS) {
          endMicSession();
          return;
        }
        if (micRestartTimer) return;
        micRestartCount += 1;
        const delay = micRestartCount > 8 ? 400 : 180;
        micRestartTimer = window.setTimeout(() => {
          micRestartTimer = 0;
          startMicEngine();
        }, delay);
      }

      function startMicEngine() {
        if (!hasRecognition || micWantStop || micFinished || micDiscard || !state.micListening) return;
        if (Date.now() - micStartedAt >= MIC_MAX_MS) {
          endMicSession();
          return;
        }
        if (micRec) return;

        const session = micSessionId;
        const rec = new SpeechRecognitionAPI();
        rec.lang = "en-US";
        rec.interimResults = true;
        rec.continuous = true;
        rec.maxAlternatives = 1;
        micRec = rec;

        rec.onresult = (event) => {
          if (session !== micSessionId || micRec !== rec || micFinished || micWantStop) return;
          let interim = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const piece = event.results[i][0] && event.results[i][0].transcript ? event.results[i][0].transcript : "";
            if (!piece) continue;
            if (event.results[i].isFinal) micFinal = joinTranscript(micFinal, piece);
            else interim = joinTranscript(interim, piece);
          }
          micHeard = joinTranscript(micFinal, interim);
          state.micInterim = micHeard;
          micLastResultAt = Date.now();
          armSilenceTimer();
          updateMicUI();
          if (targetFullyMatched(micHeard)) endMicSession();
        };

        rec.onspeechend = () => {
          if (session !== micSessionId || micRec !== rec || micFinished || micWantStop) return;
          if (micFinal || micHeard) armSilenceTimer();
        };

        rec.onerror = (event) => {
          if (session !== micSessionId || micRec !== rec) return;
          const err = event && event.error ? event.error : "";
          if (err === "aborted" || err === "no-speech") return;
          if (err === "not-allowed" || err === "service-not-allowed" || err === "audio-capture") {
            state.micNotice = "denied";
            endMicSession({ discard: true });
            return;
          }
          if (micRestartCount >= MIC_MAX_RESTARTS) {
            if (!liveMicText()) state.micNotice = "error";
            endMicSession();
          }
        };

        rec.onend = () => {
          if (micRec === rec) micRec = null;
          if (session !== micSessionId) return;
          if (micFinished || micWantStop || micDiscard || !state.micListening) {
            if (!micFinished) endMicSession({ discard: micDiscard });
            return;
          }
          scheduleMicRestart();
        };

        try {
          rec.start();
        } catch {
          micRec = null;
          if (micRestartCount >= MIC_MAX_RESTARTS) {
            if (!liveMicText()) state.micNotice = "error";
            endMicSession();
          } else {
            scheduleMicRestart();
          }
        }
      }

      function beginMic(key) {
        if (!hasRecognition) {
          state.micKey = key;
          state.micListening = false;
          state.micNotice = "unsupported";
          updateMicUI();
          return;
        }
        if (state.speaking) {
          stopSpeech();
          updateSpeakingUI();
        }
        stopMicPlayback();
        if (plainActive) stopPlainRec();
        if (state.plainNotice && state.plainNotice.key === key) state.plainNotice = null;
        micSessionId += 1;
        clearMicTimers();
        haltMicEngine();
        stopMicRecording(null, { discard: true });
        micRec = null;
        state.micKey = key;
        state.micListening = true;
        state.micInterim = "";
        state.micNotice = null;
        delete state.micResults[key];
        micFinal = "";
        micHeard = "";
        micDiscard = false;
        micFinished = false;
        micWantStop = false;
        micStartedAt = Date.now();
        micLastResultAt = 0;
        micRestartCount = 0;
        micPendingKey = null;
        updateMicUI();
        micCapTimer = window.setTimeout(() => {
          micCapTimer = 0;
          if (!state.micListening || micWantStop || micFinished) return;
          endMicSession();
        }, MIC_MAX_MS);
        startMicEngine();
        startMicRecording(micSessionId);
      }

      function stopMic(opts) {
        if (!state.micListening && !micRec && !micRestartTimer) {
          if (!(opts && opts.silent)) updateMicUI();
          return;
        }
        if (!(opts && opts.keepPending)) micPendingKey = null;
        endMicSession(opts);
      }

      function toggleMic(key) {
        if (!hasRecognition) {
          state.micKey = key;
          state.micNotice = "unsupported";
          updateMicUI();
          return;
        }
        if (state.micListening && state.micKey === key) {
          stopMic();
          return;
        }
        if (state.micListening) {
          micPendingKey = key;
          stopMic({ keepPending: true });
          return;
        }
        beginMic(key);
      }

      function svgIcon(pathD) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("aria-hidden", "true");
        svg.setAttribute("focusable", "false");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", pathD);
        path.setAttribute("fill", "currentColor");
        svg.appendChild(path);
        return svg;
      }

      function speakerIcon() {
        return svgIcon("M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z");
      }

      function stopIcon() {
        return svgIcon("M6 6h12v12H6z");
      }

      function recordIcon() {
        return svgIcon("M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm0-13c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5z");
      }

      function googleGIcon() {
        return svgIcon("M12 11v2.4h4.19c-.18 1.17-1.4 3.43-4.19 3.43-2.52 0-4.58-2.09-4.58-4.83S9.48 7.17 12 7.17c1.44 0 2.4.61 2.95 1.14l2.01-1.93C15.47 5.14 13.89 4.4 12 4.4 7.96 4.4 4.7 7.7 4.7 12s3.26 7.6 7.3 7.6c4.21 0 7-2.96 7-7.12 0-.48-.05-.84-.11-1.2H12z");
      }

      function setFsPlayIcon() {
        if (!fs.playBtn) return;
        const speaking = Boolean(state.speaking);
        fs.playBtn.replaceChildren(speaking ? stopIcon() : speakerIcon());
        fs.playBtn.setAttribute("aria-label", speaking ? "정지" : "듣기");
        fs.playBtn.setAttribute("title", speaking ? "정지" : "듣기");
      }

      function fsGoogleLink(sentence) {
        return el("a", {
          class: "fs-dock-btn",
          href: googleStudyUrl(sentence),
          target: "_blank",
          rel: "noopener",
          "aria-label": "구글 검색",
          title: "구글 검색"
        }, [googleGIcon()]);
      }

      function dockCell(node, caption) {
        if (!node) return null;
        return el("div", { class: "fs-dock-cell" }, [
          node,
          el("span", { class: "fs-dock-cap", text: caption })
        ]);
      }

      function isLangVisible(kind, key) {
        const allOn = kind === "en" ? state.showAllEn : state.showAllKo;
        const opened = kind === "en" ? state.openEn : state.openKo;
        return allOn !== Boolean(key && opened[key]);
      }

      function toggleLangLine(kind, key) {
        if (!kind || !key) return;
        const opened = kind === "en" ? state.openEn : state.openKo;
        if (opened[key]) delete opened[key];
        else opened[key] = true;
        syncLangVisibility();
      }

      function langText(tag, className, text, kind, key, opts) {
        const visible = isLangVisible(kind, key, opts);
        const attrs = {
          class: className + (visible ? "" : " is-blurred"),
          text,
          "data-lang": kind,
          "data-lang-key": key
        };
        if (!(opts && opts.noToggle)) {
          const opened = kind === "en" ? state.openEn : state.openKo;
          attrs.onClick = (e) => {
            e.stopPropagation();
            if (opened[key]) delete opened[key];
            else opened[key] = true;
            syncLangVisibility();
          };
          attrs.title = visible ? "탭해서 이 문장 가리기" : "탭해서 이 문장만 보기";
          if (!visible) attrs["aria-hidden"] = "true";
        }
        return el(tag, attrs);
      }

      function syncLangVisibility() {
        document.querySelectorAll("[data-lang]").forEach((el) => {
          const kind = el.getAttribute("data-lang");
          const key = el.getAttribute("data-lang-key");
          const visible = isLangVisible(kind, key);
          el.classList.toggle("is-blurred", !visible);
          el.title = visible ? "탭해서 이 문장 가리기" : "탭해서 이 문장만 보기";
          if (!visible) el.setAttribute("aria-hidden", "true");
          else el.removeAttribute("aria-hidden");
        });
        document.querySelectorAll(".toggle-btn.lang-toggle").forEach((btn) => {
          const isKo = btn.getAttribute("aria-label") === "한국어 뜻 보이기";
          const on = isKo ? state.showAllKo : state.showAllEn;
          btn.classList.toggle("is-on", on);
          btn.setAttribute("aria-pressed", on ? "true" : "false");
        });
        document.querySelectorAll(".mic-result[data-mic-key]").forEach((node) => {
          fillMicHost(node, node.getAttribute("data-mic-key"));
        });
      }

      function langToggleButtons() {
        return [
          el("button", {
            type: "button",
            class: "toggle-btn lang-toggle" + (state.showAllKo ? " is-on" : ""),
            text: "가",
            "aria-label": "한국어 뜻 보이기",
            "aria-pressed": state.showAllKo ? "true" : "false",
            onClick: () => {
              state.showAllKo = !state.showAllKo;
              state.openKo = {};
              saveState();
              syncLangVisibility();
            }
          }),
          el("button", {
            type: "button",
            class: "toggle-btn lang-toggle" + (state.showAllEn ? " is-on" : ""),
            text: "A",
            "aria-label": "영어 보이기",
            "aria-pressed": state.showAllEn ? "true" : "false",
            onClick: () => {
              state.showAllEn = !state.showAllEn;
              state.openEn = {};
              saveState();
              syncLangVisibility();
            }
          })
        ];
      }

      function currentOpenLesson() {
        return state.lessons.find((d) => d.date === state.openDate) || null;
      }

      function getNextLessonByDate(lesson) {
        if (!lesson) return null;
        const i = state.lessons.findIndex((d) => d.date === lesson.date);
        return i >= 0 ? state.lessons[i + 1] || null : null;
      }

      function getPrevLessonByDate(lesson) {
        if (!lesson) return null;
        const i = state.lessons.findIndex((d) => d.date === lesson.date);
        return i > 0 ? state.lessons[i - 1] : null;
      }

      function getFsCards(lesson) {
        if (!lesson) return [];
        const cards = [];
        lesson.dialogue.forEach((line, i) => {
          const m = lesson.meaning[i];
          cards.push({
            section: "대화",
            speakerEn: line.speaker,
            speakerKo: m ? m.speaker : (isYou(line.speaker) ? "나" : "직원"),
            en: line.text,
            ko: m ? m.text : "",
            lineIdx: i,
            key: "line-" + i
          });
        });
        (lesson.expressions || []).forEach((item, i) => {
          cards.push({
            section: "핵심 표현",
            speakerEn: "",
            speakerKo: "",
            en: item.en,
            ko: item.ko,
            key: "expr-" + i
          });
        });
        if (lesson.practice) {
          cards.push({
            section: "따라 말해 보기",
            speakerEn: "",
            speakerKo: "",
            en: lesson.practice,
            ko: "",
            key: "practice"
          });
        }
        return cards;
      }

      function speakerLabel(card) {
        if (card.speakerEn && card.speakerKo) return card.speakerEn + " · " + card.speakerKo;
        return card.speakerEn || card.speakerKo || "";
      }

      function buildFsCard(card) {
        const label = speakerLabel(card);
        return el("div", {
          class: "fs-card",
          title: "탭해서 듣기",
          "aria-label": "탭해서 듣기"
        }, [
          label ? el("p", { class: "fs-speaker", text: label }) : null,
          langText("p", "fs-en", card.en, "en", card.key, { noToggle: true }),
          card.ko ? langText("p", "fs-ko", card.ko, "ko", card.key, { noToggle: true }) : null,
          micHost(card.key, true)
        ]);
      }

      function fitFsEnglish(cardEl) {
        if (!cardEl) return;
        const en = cardEl.querySelector(".fs-en");
        if (!en) return;
        en.style.fontSize = "";
        const minPx = 20;
        let size = parseFloat(window.getComputedStyle(en).fontSize) || 0;
        let guard = 0;
        while (cardEl.scrollHeight > cardEl.clientHeight + 1 && size > minPx && guard++ < 14) {
          size *= 0.92;
          en.style.fontSize = size + "px";
        }
      }

      function playFsCard(card) {
        if (!card) return;
        if (!hasSpeech || !card.en) return;
        const lesson = currentOpenLesson();
        if (aiOnFor(lesson) && Number.isFinite(card.lineIdx)) {
          playAiLines(lesson, card.lineIdx, card.lineIdx + 1);
          return;
        }
        speakSingle(card.en, roleVoiceFor(lesson, card.speakerEn), isYou(card.speakerEn));
      }

      const fs = {
        root: null,
        progress: null,
        toggles: null,
        autoBtn: null,
        stage: null,
        actions: null,
        playBtn: null,
        micBtn: null,
        animTimer: 0
      };

      const FS_SESSION_KEY = "travel-english-pwa-fs";
      let locQuiet = false;

      function parseLocation() {
        const hash = location.hash || "";
        let m = hash.match(/^#lesson=(\d{4}-\d{2}-\d{2})(?:&study=(\d+))?$/);
        if (!m) m = hash.match(/^#lesson\/(\d{4}-\d{2}-\d{2})(?:\/study\/(\d+))?$/);
        if (!m) return { date: null, study: null };
        const study = m[2] != null ? parseInt(m[2], 10) : null;
        return { date: m[1], study: Number.isFinite(study) ? study : null };
      }

      function lessonHash(date, study) {
        if (!date) return location.pathname + location.search;
        return study == null ? "#lesson=" + date : "#lesson=" + date + "&study=" + study;
      }

      function setLocation(url, mode) {
        const current = url.charAt(0) === "#" ? location.hash : (location.pathname + location.search + location.hash);
        if (mode !== "push" && current === url) return;
        locQuiet = true;
        try {
          if (mode === "push") history.pushState({ study: /study/.test(url) }, "", url);
          else history.replaceState({ study: /study/.test(url) }, "", url);
        } finally {
          locQuiet = false;
        }
      }

      function writeStudySession() {
        try {
          if (state.fsOpen && state.openDate) {
            sessionStorage.setItem(FS_SESSION_KEY, JSON.stringify({
              date: state.openDate,
              index: state.fsIndex,
              showAllKo: state.showAllKo,
              showAllEn: state.showAllEn
            }));
          } else {
            sessionStorage.removeItem(FS_SESSION_KEY);
          }
        } catch {}
      }

      function readStudySession() {
        try {
          const raw = sessionStorage.getItem(FS_SESSION_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed.date !== "string") return null;
          const index = Number(parsed.index);
          return {
            date: parsed.date,
            index: Number.isFinite(index) ? index : 0,
            showAllKo: typeof parsed.showAllKo === "boolean" ? parsed.showAllKo : null,
            showAllEn: typeof parsed.showAllEn === "boolean" ? parsed.showAllEn : null
          };
        } catch {
          return null;
        }
      }

      function maybeStartFsAutoplay() {
        if (!state.fsOpen || !state.fsAutoplay || !hasSpeech || state.micListening) return;
        const lesson = currentOpenLesson();
        const card = getFsCards(lesson)[state.fsIndex];
        if (!card || !card.en) return;
        const spoken = card.en;
        const roleVoice = roleVoiceFor(lesson, card.speakerEn);
        const roleIsYou = isYou(card.speakerEn);
        const fsLineIdx = card.lineIdx;
        const useAi = aiOnFor(lesson) && Number.isFinite(fsLineIdx);
        window.setTimeout(() => {
          if (!state.fsOpen || !state.fsAutoplay || state.speaking) return;
          if (useAi) playAiLines(lesson, fsLineIdx, fsLineIdx + 1);
          else speakSingle(spoken, roleVoice, roleIsYou);
        }, 80);
      }

      function showStudyUi() {
        window.scrollTo(0, 0);
        document.body.classList.add("fs-open");
        if (fs.root) {
          fs.root.classList.add("is-open");
          fs.root.setAttribute("aria-hidden", "false");
        }
        renderFs(0);
        try { if (fs.root) fs.root.focus(); } catch {}
        if (state.fsNeedAutoStart) {
          state.fsNeedAutoStart = false;
          maybeStartFsAutoplay();
        }
      }

      function hideStudyUi() {
        stopMic({ silent: true, discard: true });
        state.fsOpen = false;
        state.fsAnimating = false;
        if (fs.animTimer) {
          window.clearTimeout(fs.animTimer);
          fs.animTimer = 0;
        }
        if (fs.root) {
          fs.root.classList.remove("is-open");
          fs.root.setAttribute("aria-hidden", "true");
        }
        document.body.classList.remove("fs-open");
        writeStudySession();
      }

      function openFullscreen(index) {
        const lesson = currentOpenLesson();
        if (!lesson) return;
        const cards = getFsCards(lesson);
        if (!cards.length) return;
        stopMic({ silent: true, discard: true });
        if (state.speaking) stopSpeech();
        state.fsOpen = true;
        state.fsIndex = Math.max(0, Math.min(index || 0, cards.length - 1));
        state.fsNeedAutoStart = true;
        writeStudySession();
        const loc = parseLocation();
        const url = lessonHash(state.openDate, state.fsIndex);
        if (loc.date === state.openDate && loc.study != null) {
          setLocation(url, "replace");
        } else {
          setLocation(url, "push");
          state.fsPushed = true;
        }
        showStudyUi();
      }

      function closeFullscreen(opts) {
        const silent = opts && opts.silent;
        const fromPop = opts && opts.fromPop;
        const keepHash = opts && opts.keepHash;
        const wasOpen = state.fsOpen || (fs.root && fs.root.classList.contains("is-open"));
        if (!wasOpen) {
          if (!keepHash && !fromPop) {
            const loc = parseLocation();
            if (loc.study != null) setLocation(lessonHash(loc.date || state.openDate, null), "replace");
          }
          writeStudySession();
          if (!silent) render();
          return;
        }
        stopSpeech();
        hideStudyUi();
        if (!fromPop && !keepHash) {
          const loc = parseLocation();
          if (loc.study != null) {
            if (state.fsPushed) {
              state.fsPushed = false;
              locQuiet = true;
              history.back();
              window.setTimeout(() => { locQuiet = false; }, 0);
            } else {
              setLocation(lessonHash(state.openDate || loc.date, null), "replace");
            }
          }
        }
        if (!fromPop) state.fsPushed = false;
        if (!silent) render();
      }

      function moveFs(dir) {
        if (!state.fsOpen || state.fsAnimating) return;
        const lesson = currentOpenLesson();
        const cards = getFsCards(lesson);
        const next = state.fsIndex + dir;
        if (next < 0) {
          goAdjacentLessonFromFs(-1);
          return;
        }
        if (next >= cards.length) {
          goAdjacentLessonFromFs(1);
          return;
        }
        state.fsIndex = next;
        writeStudySession();
        setLocation(lessonHash(state.openDate, state.fsIndex), "replace");
        stopMic({ silent: true, discard: true });
        stopSpeech();
        renderFs(dir);
        if (state.fsAutoplay && hasSpeech && !state.micListening) {
          const spoken = cards[state.fsIndex].en;
          const roleVoice = roleVoiceFor(lesson, cards[state.fsIndex].speakerEn);
          const roleIsYou = isYou(cards[state.fsIndex].speakerEn);
          const fsLineIdx = cards[state.fsIndex].lineIdx;
          const useAi = aiOnFor(lesson) && Number.isFinite(fsLineIdx);
          window.setTimeout(() => {
            if (!state.fsOpen || !state.fsAutoplay) return;
            if (useAi) playAiLines(lesson, fsLineIdx, fsLineIdx + 1);
            else speakSingle(spoken, roleVoice, roleIsYou);
          }, 280);
        }
      }

      function goAdjacentLessonFromFs(dir) {
        const lesson = currentOpenLesson();
        const target = dir > 0 ? getNextLessonByDate(lesson) : getPrevLessonByDate(lesson);
        if (!target) return;
        openLesson(target.date, { keepFs: true, fsIndex: dir > 0 ? 0 : -1 });
      }

      function renderFs(animDir) {
        const lesson = currentOpenLesson();
        if (!state.fsOpen || !lesson || !fs.root) return;
        const cards = getFsCards(lesson);
        if (!cards.length) {
          closeFullscreen({ silent: true });
          return;
        }
        if (state.fsIndex >= cards.length) state.fsIndex = cards.length - 1;
        if (state.fsIndex < 0) state.fsIndex = 0;
        const card = cards[state.fsIndex];

        fs.progress.textContent = (state.fsIndex + 1) + " / " + cards.length;
        fs.toggles.replaceChildren(...langToggleButtons());
        fs.autoBtn.classList.toggle("is-on", state.fsAutoplay);
        fs.autoBtn.setAttribute("aria-pressed", state.fsAutoplay ? "true" : "false");
        const dockKids = [];
        if (fs.playBtn) dockKids.push(dockCell(fs.playBtn, "듣기"));
        dockKids.push(dockCell(fsGoogleLink(card.en), "검색"));
        if (fs.micBtn) dockKids.push(dockCell(fs.micBtn, "마이크"));
        if (fs.recBtn) dockKids.push(dockCell(fs.recBtn, "녹음"));
        fs.actions.replaceChildren(...dockKids);
        setFsPlayIcon();
        updateMicUI();

        const node = buildFsCard(card);
        const stage = fs.stage;
        const current = stage.querySelector(".fs-card");
        const dir = animDir || 0;
        if (!current || !dir || state.fsAnimating) {
          if (fs.animTimer) {
            window.clearTimeout(fs.animTimer);
            fs.animTimer = 0;
          }
          state.fsAnimating = false;
          stage.replaceChildren(node);
          fitFsEnglish(node);
          return;
        }

        state.fsAnimating = true;
        node.classList.add(dir > 0 ? "is-from-right" : "is-from-left");
        current.classList.add(dir > 0 ? "is-to-left" : "is-to-right");
        stage.appendChild(node);
        fitFsEnglish(node);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            node.classList.add("is-in");
          });
        });
        if (fs.animTimer) window.clearTimeout(fs.animTimer);
        fs.animTimer = window.setTimeout(() => {
          if (current.parentNode) current.remove();
          node.classList.remove("is-from-right", "is-from-left", "is-in");
          state.fsAnimating = false;
          fs.animTimer = 0;
        }, 320);
      }

      function initFullscreen() {
        fs.root = el("div", {
          id: "fs-overlay",
          class: "fs-overlay",
          role: "dialog",
          "aria-modal": "true",
          "aria-label": "전체화면 보기",
          "aria-hidden": "true",
          tabindex: "-1"
        });

        fs.progress = el("span", { class: "fs-progress" });
        fs.toggles = el("div", { class: "fs-top-actions toolbar-lang-row" });
        fs.autoBtn = el("button", {
          type: "button",
          class: "toggle-btn",
          text: "▶ 자동",
          "aria-label": "카드 바꿀 때 자동 듣기",
          "aria-pressed": "false",
          onClick: () => {
            state.fsAutoplay = !state.fsAutoplay;
            saveState();
            fs.autoBtn.classList.toggle("is-on", state.fsAutoplay);
            fs.autoBtn.setAttribute("aria-pressed", state.fsAutoplay ? "true" : "false");
            if (state.fsAutoplay && !state.speaking) {
              const lesson = currentOpenLesson();
              const cards = getFsCards(lesson);
              const card = cards[state.fsIndex];
              if (card) playFsCard(card);
            }
          }
        });
        if (!hasSpeech) fs.autoBtn.hidden = true;

        const closeBtn = el("button", {
          type: "button",
          class: "fs-icon-btn",
          text: "✕",
          "aria-label": "전체화면 닫기",
          onClick: () => closeFullscreen()
        });

        const top = el("div", { class: "fs-top" }, [
          fs.progress,
          el("div", { class: "fs-top-actions" }, [
            fs.toggles,
            fs.autoBtn,
            closeBtn
          ])
        ]);

        fs.stage = el("div", { class: "fs-stage" });

        fs.playBtn = hasSpeech
          ? el("button", {
              id: "fs-play-btn",
              type: "button",
              class: "fs-dock-btn fs-dock-play",
              "aria-label": "듣기",
              title: "듣기",
              onClick: () => {
                const lesson = currentOpenLesson();
                const card = getFsCards(lesson)[state.fsIndex];
                if (!card) return;
                if (state.speaking) {
                  stopSpeech();
                  updateSpeakingUI();
                } else {
                  playFsCard(card);
                }
              }
            })
          : null;
        fs.micBtn = hasRecognition
          ? el("button", {
              type: "button",
              class: "fs-dock-btn fs-dock-mic",
              "aria-label": "발음 확인",
              title: "발음 확인",
              "aria-pressed": "false",
              onClick: (e) => {
                e.preventDefault();
                e.stopPropagation();
                const key = currentFsMicKey();
                if (key) toggleMic(key);
              }
            }, [svgIcon("M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z")])
          : null;
        fs.recBtn = hasRecorder
          ? el("button", {
              type: "button",
              class: "fs-dock-btn fs-dock-rec",
              "aria-label": "내 목소리 녹음",
              title: "내 목소리 녹음",
              "aria-pressed": "false",
              onClick: (e) => {
                e.preventDefault();
                e.stopPropagation();
                const key = currentFsMicKey();
                if (key) togglePlainRec(key);
              }
            }, [recordIcon()])
          : null;
        fs.actions = el("div", { class: "fs-actions" });
        const bottom = el("div", { class: "fs-bottom" }, [
          fs.actions
        ]);
        setFsPlayIcon();

        fs.root.append(top, fs.stage, bottom);
        document.body.appendChild(fs.root);

        const SWIPE_X = 56;
        const TAP_MOVE = 14;
        const TAP_MS = 500;
        let ptr = null;
        fs.stage.addEventListener("pointerdown", (e) => {
          if (e.button != null && e.button !== 0) return;
          if (e.target.closest("button, a, .mic-result")) return;
          ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, t: Date.now(), locked: false, target: e.target };
        });
        fs.stage.addEventListener("pointermove", (e) => {
          if (!ptr || e.pointerId !== ptr.id) return;
          const dx = e.clientX - ptr.x;
          const dy = e.clientY - ptr.y;
          if (!ptr.locked && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) {
            ptr.locked = true;
            try { fs.stage.setPointerCapture(e.pointerId); } catch {}
          }
          if (ptr.locked) e.preventDefault();
        });
        const endPtr = (e) => {
          if (!ptr || e.pointerId !== ptr.id) return;
          const dx = e.clientX - ptr.x;
          const dy = e.clientY - ptr.y;
          const dt = Date.now() - ptr.t;
          const locked = ptr.locked;
          const startTarget = ptr.target;
          ptr = null;
          if (locked) {
            if (Math.abs(dx) >= SWIPE_X && Math.abs(dx) > Math.abs(dy)) {
              moveFs(dx < 0 ? 1 : -1);
            }
            return;
          }
          if (Math.hypot(dx, dy) < TAP_MOVE && dt < TAP_MS) {
            if (startTarget && startTarget.closest && startTarget.closest(".mic-result, button, a")) return;
            const langEl = startTarget && startTarget.closest && startTarget.closest("[data-lang]");
            if (langEl && fs.stage.contains(langEl)) {
              toggleLangLine(langEl.getAttribute("data-lang"), langEl.getAttribute("data-lang-key"));
              return;
            }
            const lesson = currentOpenLesson();
            playFsCard(getFsCards(lesson)[state.fsIndex]);
          }
        };
        fs.stage.addEventListener("pointerup", endPtr);
        fs.stage.addEventListener("pointercancel", () => { ptr = null; });

        window.addEventListener("keydown", (e) => {
          if (!state.fsOpen) return;
          if (e.key === "Escape") {
            e.preventDefault();
            closeFullscreen();
          } else if (e.key === "ArrowLeft") {
            e.preventDefault();
            moveFs(-1);
          } else if (e.key === "ArrowRight") {
            e.preventDefault();
            moveFs(1);
          }
        });
      }

      function haystack(d) {
        return [
          d.title,
          d.dateLabel,
          d.date,
          d.intro,
          d.subtitle,
          d.category,
          ...d.dialogue.map((l) => l.speaker + " " + l.text),
          ...d.meaning.map((l) => l.speaker + " " + l.text),
          ...d.expressions.map((e) => e.en + " " + e.ko),
          d.practice,
          d.practiceNote || ""
        ].join("\n").toLowerCase();
      }

      let aiToken = 0;
      let aiAudioEl = null;

      function stopSpeech() {
        aiToken += 1;
        if (aiAudioEl) {
          try { aiAudioEl.pause(); } catch { /* ignore */ }
          aiAudioEl = null;
        }
        if (hasSpeech) {
          window.speechSynthesis.cancel();
        }
        state.speaking = false;
        state.speakingLineIdx = -1;
      }

      function pickVoice() {
        if (!hasSpeech) return null;
        const voices = window.speechSynthesis.getVoices();
        return (
          voices.find((v) => v.lang === "en-US" && v.localService) ||
          voices.find((v) => v.lang === "en-US") ||
          voices.find((v) => v.lang && v.lang.startsWith("en")) ||
          null
        );
      }

      function roleVoices() {
        if (!hasSpeech) return [null, null];
        const voices = window.speechSynthesis.getVoices();
        const en = voices.filter((v) => ((v.lang || "") + "").toLowerCase().startsWith("en"));
        if (!en.length) return [null, null];
        const lname = (v) => ((v.name || "") + "").toLowerCase();
        const match = (v, keys) => keys.some((k) => lname(v).indexOf(k) !== -1);
        const NOVELTY = ["bahh", "bells", "boing", "cellos", "bad news", "good news", "bubbles", "trinoids", "whisper", "zarvox", "hysterical", "pipeline", "wobble", "fahrenheit", "jester", "deranged", "superman", "badyet", "junior", "elliot", "fred ("];
        const usable = en.filter((v) => !NOVELTY.some((k) => lname(v).indexOf(k) !== -1));
        const pool = usable.length ? usable : en;
        const youVoice =
          pool.find((v) => match(v, ["google us english", "samantha", "aria", "jenny", "zira", "susan", "karen", "female"])) ||
          pool.find((v) => v.lang === "en-US" && v.localService) ||
          pool.find((v) => v.lang === "en-US") ||
          pool[0];
        const staffVoice =
          pool.find((v) => v !== youVoice && match(v, ["guy", "alex", "david", "daniel", "fred", "mark", "george", "oliver", "arthur", "albert", "male"])) ||
          pool.find((v) => v !== youVoice && v.lang === "en-US") ||
          pool.find((v) => v !== youVoice) ||
          youVoice;
        return [youVoice, staffVoice];
      }

      function dualOnFor(lesson) {
        if (!state.dualVoice || !lesson || !DUAL_VOICE_DATES.has(lesson.date)) return false;
        if (AI_VOICE_DATES.has(lesson.date)) return false;
        const pair = roleVoices();
        return Boolean(pair[0]);
      }

      function rolePitch(isYouLine) {
        const pair = roleVoices();
        const distinct = Boolean(pair[0] && pair[1] && pair[0].name !== pair[1].name);
        if (!distinct) return 1.0;
        return isYouLine ? 1.12 : 0.9;
      }

      function roleVoiceFor(lesson, speaker) {
        if (!lesson || !speaker) return null;
        if (!dualOnFor(lesson)) return null;
        const pair = roleVoices();
        return isYou(speaker) ? pair[0] : pair[1];
      }

      function aiOnFor(lesson) {
        return Boolean(state.dualVoice) && Boolean(lesson) && AI_VOICE_DATES.has(lesson.date);
      }

      function aiFileUrl(date, idx) {
        return "audio/" + date + "/" + (idx < 10 ? "0" : "") + idx + ".mp3";
      }

      function playAiLines(lesson, startIdx, endIdx) {
        stopMic({ silent: true, discard: true });
        stopMicPlayback();
        stopSpeech();
        const tok = ++aiToken;
        let idx = startIdx;
        state.speaking = true;
        updateSpeakingUI();
        const step = () => {
          if (tok !== aiToken) return;
          if (idx >= endIdx) {
            state.speaking = false;
            state.speakingLineIdx = -1;
            aiAudioEl = null;
            updateSpeakingUI();
            return;
          }
          state.speakingLineIdx = idx;
          updateSpeakingUI();
          const from = idx;
          const a = new Audio(aiFileUrl(lesson.date, idx));
          a.playbackRate = RATES[state.rateIdx];
          aiAudioEl = a;
          const fallback = () => {
            if (tok !== aiToken) return;
            aiAudioEl = null;
            state.speaking = false;
            updateSpeakingUI();
            speakDialogue(lesson.dialogue.slice(from, endIdx).map((l) => l.text), null, null);
          };
          a.onended = () => {
            if (tok !== aiToken) return;
            idx += 1;
            if (idx < endIdx) window.setTimeout(step, 320);
            else {
              state.speaking = false;
              state.speakingLineIdx = -1;
              aiAudioEl = null;
              updateSpeakingUI();
            }
          };
          a.onerror = fallback;
          a.play().catch(() => fallback());
        };
        step();
      }

      function saveDualVoice() {
        try {
          localStorage.setItem(DUAL_VOICE_KEY, state.dualVoice ? "1" : "0");
        } catch {
          /* ignore */
        }
      }

      if (hasSpeech) {
        const warmupVoices = () => {
          try {
            const w = new SpeechSynthesisUtterance("ok");
            w.volume = 0;
            w.lang = "en-US";
            window.speechSynthesis.speak(w);
          } catch {
            /* ignore */
          }
        };
        warmupVoices();
        window.__warmupVoices = warmupVoices;
        window.speechSynthesis.addEventListener("voiceschanged", () => {
          if (!state.speaking && !state.fsOpen) render();
        });
      }

      function dualNoteText() {
        const pair = roleVoices();
        const first = (v) => ((v.name || "").split(" ")[0] || "en").trim();
        if (!pair[0] || !pair[1]) return "음성 준비 중…";
        if (pair[0] === pair[1]) return first(pair[0]) + " (음성 1개)";
        return first(pair[0]) + " / " + first(pair[1]);
      }

      function speakSingle(text, voiceOverride, youFlag) {
        if (!hasSpeech) return;
        stopMic({ silent: true, discard: true });
        stopMicPlayback();
        stopSpeech();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "en-US";
        u.rate = RATES[state.rateIdx];
        const v = voiceOverride || pickVoice();
        if (v) u.voice = v;
        if (voiceOverride && youFlag !== undefined && youFlag !== null) {
          u.pitch = rolePitch(Boolean(youFlag));
        }
        u.onend = () => {
          state.speaking = false;
          state.speakingLineIdx = -1;
          updateSpeakingUI();
        };
        u.onerror = () => {
          state.speaking = false;
          state.speakingLineIdx = -1;
          updateSpeakingUI();
        };
        state.speaking = true;
        window.speechSynthesis.speak(u);
        updateSpeakingUI();
      }

      function speakDialogue(lines, voices, youFlags) {
        if (!hasSpeech) return;
        if (state.speaking) {
          stopSpeech();
          updateSpeakingUI();
          return;
        }
        stopMic({ silent: true, discard: true });
        stopSpeech();
        const voice = pickVoice();
        const rate = RATES[state.rateIdx];
        state.speaking = true;
        let idx = 0;

        const next = () => {
          if (!state.speaking || idx >= lines.length) {
            state.speaking = false;
            state.speakingLineIdx = -1;
            updateSpeakingUI();
            return;
          }
          state.speakingLineIdx = idx;
          updateSpeakingUI();
          const u = new SpeechSynthesisUtterance(lines[idx]);
          u.lang = "en-US";
          u.rate = rate;
          const roleVoice = voices && voices[idx] ? voices[idx] : null;
          if (roleVoice) {
            u.voice = roleVoice;
            u.pitch = rolePitch(Boolean(youFlags && youFlags[idx]));
          } else if (voice) u.voice = voice;
          u.onend = () => {
            idx += 1;
            if (roleVoice) setTimeout(next, 320);
            else next();
          };
          u.onerror = () => {
            state.speaking = false;
            state.speakingLineIdx = -1;
            updateSpeakingUI();
          };
          window.speechSynthesis.speak(u);
        };
        next();
      }

      function speakingChromeInsets() {
        let top = 0;
        let bottom = 0;
        document.querySelectorAll(".detail-toolbar, .detail-topbar, .bottom-bar").forEach((el) => {
          if (el.hidden) return;
          const pos = window.getComputedStyle(el).position;
          if (pos !== "fixed" && pos !== "sticky") return;
          const r = el.getBoundingClientRect();
          if (r.bottom > 0 && r.top < window.innerHeight * 0.45) {
            top = Math.max(top, r.bottom);
          }
          if (r.top < window.innerHeight && r.bottom > window.innerHeight * 0.55) {
            bottom = Math.max(bottom, window.innerHeight - r.top);
          }
        });
        return { top, bottom };
      }

      function scrollSpeakingLineIntoView() {
        if (state.fsOpen || !state.speaking || state.speakingLineIdx < 0) return;
        const node = document.querySelector('.bubble[data-line-idx="' + state.speakingLineIdx + '"]');
        if (!node) return;
        const rect = node.getBoundingClientRect();
        const chrome = speakingChromeInsets();
        const edge = 48;
        const visTop = chrome.top + edge;
        const visBottom = window.innerHeight - chrome.bottom - edge;
        if (rect.top >= visTop && rect.bottom <= visBottom) return;
        const visMid = (chrome.top + (window.innerHeight - chrome.bottom)) / 2;
        const elMid = (rect.top + rect.bottom) / 2;
        const delta = elMid - visMid;
        if (Math.abs(delta) < 8) return;
        window.scrollBy({ top: delta, behavior: "smooth" });
      }

      function updateSpeakingUI() {
        const playBtn = document.getElementById("play-all-btn");
        if (playBtn) {
          playBtn.textContent = state.speaking ? "■ 중지" : "▶ 전체 듣기";
          playBtn.setAttribute("aria-label", state.speaking ? "전체 듣기 중지" : "전체 듣기");
        }
        setFsPlayIcon();
        document.querySelectorAll("[data-line-idx]").forEach((node) => {
          const idx = Number(node.getAttribute("data-line-idx"));
          node.classList.toggle("is-speaking", state.speaking && idx === state.speakingLineIdx);
        });
        scrollSpeakingLineIntoView();
      }

      function getFiltered() {
        const q = state.query.trim().toLowerCase();
        const newestFirst = [...state.lessons].reverse();
        const bySearch = q ? newestFirst.filter((d) => haystack(d).includes(q)) : newestFirst;
        const byStatus = bySearch.filter((d) => {
          if (state.statusFilter === "studied") return Boolean(state.studied[d.date]);
          if (state.statusFilter === "unstudied") return !state.studied[d.date];
          if (state.statusFilter === "favorite") return Boolean(state.favorite[d.date]);
          return true;
        });
        const counts = {};
        for (const cat of CATEGORIES) counts[cat] = 0;
        counts["전체"] = byStatus.length;
        for (const d of byStatus) counts[d.category] = (counts[d.category] || 0) + 1;

        const final = state.category === "전체"
          ? byStatus
          : byStatus.filter((d) => d.category === state.category);
        return { final, counts };
      }

      function openLesson(date, opts) {
        const keepFs = Boolean(opts && opts.keepFs);
        stopMic({ silent: true, discard: true });
        if (!keepFs || date !== state.openDate) clearMicResults();
        stopSpeech();
        if (state.fsOpen && !keepFs) closeFullscreen({ silent: true, keepHash: true });
        state.openDate = date;
        state.openKo = {};
        state.openEn = {};
        if (keepFs && date) {
          state.fsOpen = true;
          state.fsNeedAutoStart = true;
          const requested = opts && Number.isFinite(Number(opts.fsIndex)) ? Number(opts.fsIndex) : 0;
          const cards = getFsCards(state.lessons.find((d) => d.date === date));
          state.fsIndex = requested < 0 ? Math.max(0, cards.length - 1) : Math.max(0, Math.min(requested, Math.max(cards.length - 1, 0)));
          writeStudySession();
        }
        const target = date ? lessonHash(date, keepFs ? state.fsIndex : null) : (location.pathname + location.search);
        const atTarget = date ? location.hash === target : !location.hash;
        if (!atTarget) {
          setLocation(target, "push");
          if (keepFs) state.fsPushed = true;
        } else if (keepFs) {
          setLocation(target, "replace");
        }
        window.scrollTo(0, 0);
        render();
      }

      function toggleStudied(date) {
        if (state.studied[date]) delete state.studied[date];
        else state.studied[date] = true;
        saveState();
        render();
      }

      function toggleFavorite(date) {
        if (state.favorite[date]) delete state.favorite[date];
        else state.favorite[date] = true;
        saveState();
        render();
      }

      function renderHome() {
        const { final, counts } = getFiltered();
        const studiedCount = Object.keys(state.studied).length;
        const favCount = Object.keys(state.favorite).length;

        const hero = el("header", { class: "hero" }, [
          el("div", { class: "hero-top" }, [
            el("h1", { text: "여행 영어 대화 모음" }),
            state.installPrompt
              ? el("button", {
                  class: "install-btn",
                  type: "button",
                  text: "📲 앱 설치",
                  onClick: async () => {
                    const p = state.installPrompt;
                    if (!p) return;
                    p.prompt();
                    await p.userChoice;
                    state.installPrompt = null;
                    render();
                  }
                })
              : null
          ]),
          el("p", {
            class: "hero-sub",
            text: state.lessons.length
              ? `${formatDotDate(state.lessons[0].date)} – ${formatDotDate(state.lessons[state.lessons.length - 1].date)} · 총 ${state.lessons.length}개 장면 (최신순)`
              : "총 0개 장면"
          }),
          el("div", { class: "stats-row" }, [
            el("span", { class: "stat-pill", text: `✓ 학습 완료 ${studiedCount}/${state.lessons.length}` }),
            el("span", { class: "stat-pill", text: `★ 즐겨찾기 ${favCount}` }),
            state.offlineReady
              ? el("span", { class: "stat-pill is-offline", text: "● 오프라인 저장됨" })
              : null
          ])
        ]);

        const searchInput = el("input", {
          id: "search-box",
          class: "search-input",
          type: "search",
          placeholder: "단어, 표현, 장면 검색 (예: airport, 세탁, 체크인)",
          value: state.query,
          "aria-label": "대화 검색",
          onInput: (e) => {
            state.query = e.target.value;
            renderHomeResultsOnly();
          }
        });

        const clearBtn = state.query
          ? el("button", {
              class: "search-clear",
              type: "button",
              "aria-label": "검색어 지우기",
              text: "×",
              onClick: () => {
                state.query = "";
                render();
                const box = document.getElementById("search-box");
                if (box) box.focus();
              }
            })
          : null;

        const controls = el("section", { class: "controls" }, [
          el("div", { class: "search-wrap" }, [
            el("span", { class: "search-icon", "aria-hidden": "true", text: "🔍" }),
            searchInput,
            clearBtn
          ]),
          el("div", { class: "chips-row", role: "tablist", "aria-label": "카테고리" },
            CATEGORIES.map((cat) => {
              const meta = CATEGORY_META[cat];
              return el("button", {
                type: "button",
                class: "chip" + (state.category === cat ? " is-active" : ""),
                onClick: () => {
                  state.category = cat;
                  render();
                }
              }, [
                meta ? el("span", { "aria-hidden": "true", text: meta.icon }) : null,
                el("span", { text: cat }),
                el("span", { class: "chip-count", text: String(counts[cat] || 0) })
              ]);
            })
          ),
          el("div", { class: "subfilters" }, [
            el("div", { class: "status-chips" },
              STATUS_FILTERS.map((sf) =>
                el("button", {
                  type: "button",
                  class: "status-chip" + (state.statusFilter === sf.id ? " is-active" : ""),
                  text: sf.label,
                  onClick: () => {
                    state.statusFilter = sf.id;
                    render();
                  }
                })
              )
            ),
            el("span", {
              id: "result-meta",
              class: "result-meta",
              text: `${final.length}개 표시 중`
            })
          ])
        ]);

        const listContainer = el("section", { id: "results-area" });
        fillResultsArea(listContainer, final);

        const footer = el("p", {
          class: "footer-note",
          text: "참고: 9월 20~27일 아침 대화와 초기 추가 대화 15개는 이전 채팅 기록을 불러올 수 없어 포함되지 않았습니다."
        });

        appEl.replaceChildren(hero, controls, listContainer, footer);
      }

      function fillResultsArea(container, final) {
        if (final.length === 0) {
          container.replaceChildren(
            el("div", { class: "empty-state" }, [
              el("p", { text: "조건에 맞는 대화가 없어요." }),
              el("button", {
                type: "button",
                class: "btn",
                text: "필터 초기화",

                  state.query = "";

                  render();
                }
              })

        const grid = el("div", { class: "card-grid" },
          final.map((d) => {
            const isStudied = Boolean(state.studied[d.date]);
            const isFav = Boolean(state.favorite[d.date]);
            const meta = CATEGORY_META[d.category] || { icon: "💬" };

            return el("article", {
              class: "scene-card" + (isStudied ? " is-studied" : ""),
              tabindex: "0",

              onClick: () => openLesson(d.date),

                }

            }, [
              el("div", { class: "card-top" }, [
                el("div", { class: "card-meta" }, [

                ]),

                  el("button", {

                      e.stopPropagation();
                      toggleFavorite(d.date);
                    }
                  }),
                  el("button", {
                    type: "button",
                    class: "icon-mark" + (isStudied ? " is-done" : ""),
                    title: "학습 완료",
                    "aria-label": "학습 완료 토글",
                    text: "✓",

                      e.stopPropagation();

                    }

              ]),
              el("h2", { class: "card-title", text: d.title }),
              el("p", { class: "card-sub", text: d.subtitle })
            ]);
          })
        );
        container.replaceChildren(grid);
      }

      function renderHomeResultsOnly() {
        const { final, counts } = getFiltered();
        const area = document.getElementById("results-area");
        const meta = document.getElementById("result-meta");
        if (meta) meta.textContent = `${final.length}개 표시 중`;
        if (area) fillResultsArea(area, final);
        document.querySelectorAll(".chips-row .chip").forEach((chip, i) => {
          const cat = CATEGORIES[i];
          const countEl = chip.querySelector(".chip-count");
          if (countEl && cat) countEl.textContent = String(counts[cat] || 0);
        });

      function renderDetail(lesson) {

          ? final
          : [...state.lessons].reverse();
        const idx = navList.findIndex((d) => d.date === lesson.date);
        const prevLesson = idx > 0 ? navList[idx - 1] : null;
        const nextLesson = idx >= 0 && idx < navList.length - 1 ? navList[idx + 1] : null;

        const isStudied = Boolean(state.studied[lesson.date]);
        const isFav = Boolean(state.favorite[lesson.date]);
        const catMeta = CATEGORY_META[lesson.category] || { icon: "💬" };

        const topbar = el("div", { class: "detail-topbar" }, [
          el("button", {
            type: "button",
            class: "btn",

          }),

              type: "button",

            }),
            el("button", {

              class: "btn btn-done" + (isStudied ? " is-on" : ""),
